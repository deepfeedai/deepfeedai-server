<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Newsroom Chat</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    .chat-shell { display:grid; grid-template-columns: 280px 1fr; gap:0; height:calc(100vh - 56px); }
    .chat-roster { border-right:1px solid var(--border); overflow-y:auto; padding:12px; background:var(--bg-card); }
    .roster-item { display:flex; gap:10px; align-items:center; padding:10px; border-radius:8px; cursor:pointer; margin-bottom:4px; }
    .roster-item:hover { background:var(--surface2); }
    .roster-item.active { background:var(--surface2); border:1px solid var(--primary); }
    .roster-avatar { width:36px; height:36px; border-radius:50%; background:var(--surface2); flex-shrink:0; object-fit:cover; position:relative; }
    .presence-dot { position:absolute; bottom:-2px; right:-2px; width:11px; height:11px; border-radius:50%; border:2px solid var(--bg-card); display:inline-block; }
    .presence-idle { background:#9ca3af; }
    .presence-chatting { background:#3b82f6; }
    .presence-drafting { background:#fbbf24; }
    .presence-researching { background:#a78bfa; }
    .presence-waiting-on-editor { background:#f97316; }
    .roster-avatar-wrap { position:relative; flex-shrink:0; }
    .roster-meta { flex:1; min-width:0; }
    .roster-name { font-weight:600; font-size:14px; line-height:1.2; }
    .roster-beat { font-size:11px; color:var(--muted); margin-top:2px; }
    .chat-main { display:flex; flex-direction:column; height:100%; min-width:0; }
    .chat-header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); }
    .chat-header-title { font-weight:700; }
    .chat-header-meta { font-size:12px; color:var(--muted); }
    .chat-thread { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; }
    .chat-row { display:flex; gap:10px; align-items:flex-end; }
    .chat-row-user { justify-content:flex-end; }
    .chat-row-assistant { justify-content:flex-start; }
    .chat-avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; object-fit:cover; }
    .chat-avatar-fallback { display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
    .chat-bubble-wrap { display:flex; flex-direction:column; max-width:75%; }
    .chat-bubble-name { font-size:11px; font-weight:600; margin-bottom:3px; padding-left:2px; }
    .chat-bubble { max-width:100%; padding:10px 14px; border-radius:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
    .chat-bubble.user { background:var(--primary); color:white; border-bottom-right-radius:4px; }
    .chat-bubble.assistant { color:var(--text); border-bottom-left-radius:4px; }
    .chat-bubble a { color:inherit; text-decoration:underline; }
    .chat-input-row { display:flex; gap:8px; padding:12px 20px; border-top:1px solid var(--border); background:var(--bg-card); }
    .chat-input-row textarea { flex:1; padding:10px 12px; border:1px solid var(--border); background:var(--bg-card); color:var(--text); border-radius:10px; resize:none; max-height:120px; min-height:40px; font-family:inherit; font-size:14px; }
    .chat-empty { text-align:center; color:var(--muted); padding:40px; }
    .chat-typing { font-size:12px; color:var(--muted); padding:0 4px; }
  </style>
</head>
<body>
<div class="admin-layout">
  <div class="main-content" style="padding:0;">
    <div class="topbar">
      <button class="hamburger" id="hamburger">&#9776;</button>
      <div class="topbar-title">Newsroom Chat</div>
    </div>
    <div class="chat-shell">
      <div class="chat-roster" id="chatRoster">
        <div class="chat-empty">Loading writers…</div>
      </div>
      <div class="chat-main">
        <div class="chat-header">
          <div>
            <div class="chat-header-title" id="chatHeaderTitle">Pick a writer</div>
            <div class="chat-header-meta" id="chatHeaderMeta"></div>
          </div>
          <button class="btn btn-outline btn-sm" id="clearBtn" style="display:none;">Clear context</button>
        </div>
        <div class="chat-thread" id="chatThread">
          <div class="chat-empty">Pick a writer from the left to start a conversation.</div>
        </div>
        <div class="chat-input-row" id="chatInputRow" style="display:none;">
          <textarea id="chatInput" rows="1" placeholder="Message your writer… (Enter to send, Shift+Enter for newline)"></textarea>
          <button class="btn btn-primary" id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/admin.js"></script>
<script src="/notifications-bell.js"></script>
<script src="/newsroom-chat-page.js"></script>
</body>
</html>

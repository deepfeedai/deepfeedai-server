<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Newsroom Chat</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    /* Pin the chat layout so input is always in view */
    html, body { height: 100%; overflow: hidden; }
    .main-content { height: 100vh; overflow: hidden; }

    .chat-shell { display:grid; grid-template-columns: 280px 1fr; gap:0; height:calc(100vh - 56px); overflow:hidden; }
    .chat-roster { border-right:1px solid var(--border); overflow-y:auto; padding:12px; background:var(--bg-card); }
    .roster-item { display:flex; gap:10px; align-items:center; padding:10px; border-radius:8px; cursor:pointer; margin-bottom:4px; }
    .roster-item:hover { background:var(--surface2); }
    .roster-item.active { background:var(--surface2); border:1px solid var(--primary); }
    .roster-avatar { width:36px; height:36px; border-radius:50%; background:var(--surface2); flex-shrink:0; object-fit:cover; position:relative; }
    .presence-dot { position:absolute; bottom:-2px; right:-2px; width:11px; height:11px; border-radius:50%; border:2px solid var(--bg-card); display:inline-block; }
    .presence-idle { background:#9ca3af; }
    .presence-chatting { background:#3b82f6; }
    .presence-drafting { background:#fbbf24; }
    .presence-researching { background:#a78bfa; }
    .presence-waiting-on-editor { background:#f97316; }
    .roster-avatar-wrap { position:relative; flex-shrink:0; }
    .roster-meta { flex:1; min-width:0; }
    .roster-name { font-weight:600; font-size:14px; line-height:1.2; }
    .roster-beat { font-size:11px; color:var(--muted); margin-top:2px; }
    .chat-main { display:flex; flex-direction:column; height:100%; min-width:0; overflow:hidden; }
    .chat-header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); flex-shrink:0; }
    .chat-header-title { font-weight:700; }
    .chat-header-meta { font-size:12px; color:var(--muted); }
    .chat-thread { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:10px; min-height:0; }
    .chat-row { display:flex; gap:10px; align-items:flex-end; }
    .chat-row-user { justify-content:flex-end; }
    .chat-row-assistant { justify-content:flex-start; }
    .chat-avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; object-fit:cover; }
    .chat-avatar-fallback { display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
    .chat-bubble-wrap { display:flex; flex-direction:column; max-width:75%; }
    .chat-bubble-name { font-size:11px; font-weight:600; margin-bottom:3px; padding-left:2px; }
    .chat-bubble { max-width:100%; padding:10px 14px; border-radius:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
    .chat-bubble.user { background:var(--primary); color:white; border-bottom-right-radius:4px; }
    .chat-bubble.assistant { color:var(--text); border-bottom-left-radius:4px; }
    .chat-bubble a { color:inherit; text-decoration:underline; }
    .chat-footer { flex-shrink:0; background:var(--bg-card); border-top:1px solid var(--border); }
    .chat-footer-actions { display:flex; justify-content:flex-end; padding:4px 20px 0; }
    .chat-footer-actions button { font-size:11px; color:var(--muted); background:none; border:none; cursor:pointer; padding:4px 6px; border-radius:4px; }
    .chat-footer-actions button:hover { color:var(--text); background:var(--surface2); }
    .chat-input-row { display:flex; gap:8px; padding:10px 20px 12px; position:relative; }
    .chat-input-row textarea { flex:1; padding:10px 12px; border:1px solid var(--border); background:var(--surface2); color:var(--text); border-radius:10px; resize:none; max-height:120px; min-height:40px; font-family:inherit; font-size:14px; }
    .chat-attach-btn { background:none; border:1px solid var(--border); border-radius:8px; padding:0 10px; color:var(--muted); cursor:pointer; font-size:16px; align-self:flex-end; height:40px; flex-shrink:0; }
    .chat-attach-btn:hover { color:var(--text); background:var(--surface2); }
    .chat-attach-btn.active { color:var(--primary); border-color:var(--primary); }
    .chat-empty { text-align:center; color:var(--muted); padding:40px; }
    .chat-typing { font-size:12px; color:var(--muted); padding:0 4px; }
    /* picker + context bar + attach panel + proposal card styles in admin.css */
  </style>
</head>
<body>
<div class="admin-layout">
  <div class="main-content" style="padding:0;">
    <div class="topbar">
      <button class="hamburger" id="hamburger">&#9776;</button>
      <div class="topbar-title">Newsroom Chat</div>
    </div>
    <div class="chat-shell">
      <div class="chat-roster" id="chatRoster">
        <div class="chat-empty">Loading writers…</div>
      </div>
      <div class="chat-main">
        <div class="chat-header">
          <div>
            <div class="chat-header-title" id="chatHeaderTitle">Pick a writer</div>
            <div class="chat-header-meta" id="chatHeaderMeta"></div>
          </div>
        </div>
        <div class="chat-thread" id="chatThread">
          <div class="chat-empty">Pick a writer from the left to start a conversation.</div>
        </div>
        <div class="chat-footer" id="chatFooter" style="display:none;">
          <div class="chat-footer-actions">
            <button id="clearBtn">🗑 Clear chat</button>
          </div>
          <div class="chat-context-bar" id="chatContextBar" style="display:none;">
            <span>📄 Context:</span>
            <div class="chat-context-chip">
              <span class="chat-context-chip-label" id="chatContextLabel"></span>
              <button class="chat-context-dismiss" id="chatContextDismiss" title="Remove context">✕</button>
            </div>
          </div>
          <div class="chat-input-row" id="chatInputRow">
            <div id="chatAttachPanel" class="chat-attach-panel" style="display:none;">
              <div class="chat-attach-search">
                <span style="color:var(--muted);">🔍</span>
                <input id="chatAttachSearch" type="text" placeholder="Search articles…" autocomplete="off" />
              </div>
              <div id="chatAttachResults"><div class="chat-attach-empty">Type to search articles</div></div>
            </div>
            <button class="chat-attach-btn" id="chatAttachBtn" title="Attach article context">📎</button>
            <textarea id="chatInput" rows="1" placeholder="Message your writer… (Enter to send, Shift+Enter for newline)"></textarea>
            <button class="btn btn-primary" id="sendBtn">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/admin.js"></script>
<script src="/admin-mobile-nav.js"></script>
<script src="/notifications-bell.js"></script>
<script src="/newsroom-chat-page.js"></script>
</body>
</html>

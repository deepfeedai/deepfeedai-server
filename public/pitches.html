<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Story Pitches</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    .pitch-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:16px; }
    .pitch-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:18px; position:relative; }
    .pitch-card-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .pitch-avatar { width:36px; height:36px; border-radius:50%; object-fit:cover; }
    .pitch-avatar-placeholder { width:36px; height:36px; border-radius:50%; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:16px; }
    .pitch-type { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; padding:2px 8px; border-radius:4px; }
    .pitch-type-new_story { background:rgba(59,130,246,0.15); color:#3b82f6; }
    .pitch-type-follow_up { background:rgba(168,85,247,0.15); color:#a855f7; }
    .pitch-type-roundup { background:rgba(34,197,94,0.15); color:#22c55e; }
    .pitch-type-prediction_check { background:rgba(251,191,36,0.15); color:#fbbf24; }
    .pitch-priority { position:absolute; top:12px; right:14px; font-size:12px; font-weight:700; }
    .pitch-headline { font-size:16px; font-weight:700; margin-bottom:8px; line-height:1.3; }
    .pitch-reasoning { color:var(--muted); font-size:13px; line-height:1.5; margin-bottom:12px; }
    .pitch-meta { font-size:11px; color:var(--muted); margin-bottom:12px; }
    .pitch-actions { display:flex; gap:8px; }
    .newsroom-item { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
    .newsroom-item:last-child { border-bottom:none; }
  </style>
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">&#9776;</button>
      <div class="topbar-title">Story Pitches</div>
    </header>

    <div class="page-body">
      <div class="tab-bar" id="pitchTabs">
        <button class="tab-btn active" data-tab="pitches">Pitches <span class="tab-badge" id="pendingBadge"></span></button>
        <button class="tab-btn" data-tab="newsroom">Newsroom</button>
      </div>

      <!-- Pitches Tab -->
      <div id="pitchesSection">
        <div class="section-header">
          <div class="section-title">Pending Pitches</div>
          <div style="display:flex;gap:8px;">
            <select class="form-control" id="pitchStatusFilter" style="width:auto;font-size:13px;">
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="synthesized">Synthesized</option>
              <option value="dismissed">Dismissed</option>
              <option value="all">All</option>
            </select>
            <select class="form-control" id="pitchWriterFilter" style="width:auto;font-size:13px;">
              <option value="all">All Writers</option>
            </select>
          </div>
        </div>

        <div id="pitchGrid" class="pitch-grid">
          <div style="text-align:center;padding:40px;grid-column:1/-1;"><span class="spinner"></span></div>
        </div>
      </div>

      <!-- Newsroom Tab -->
      <div id="newsroomSection" style="display:none;">
        <div class="section-header">
          <div class="section-title">Newsroom Activity</div>
        </div>
        <div id="newsroomFeed" class="wd-card" style="padding:16px;">
          <div style="text-align:center;padding:40px;"><span class="spinner"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script src="/pitches-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Feed Inbox</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
<div class="admin-layout">
  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <div class="topbar-title">Feed Inbox</div>
    </header>

    <div class="page-body page-body-wide">

      <div class="section-header">
        <div class="tab-bar">
          <button class="tab-btn active" data-tab="all">All Sources</button>
          <button class="tab-btn" data-tab="today">Today <span class="tab-badge" id="todayCount"></span></button>
          <button class="tab-btn" data-tab="week">This Week <span class="tab-badge" id="weekCount"></span></button>
        </div>
        <div class="btn-group">
          <button class="btn btn-outline btn-sm" id="fetchSourcesBtn" title="Trigger RSS fetch now">🔄 Fetch Sources</button>
          <div class="dropdown" id="purgeDropdown" style="position:relative;">
            <button class="btn btn-danger btn-sm" id="purgeArticlesBtn" title="Purge feed articles">🗑 Purge Feed</button>
            <div id="purgeMenu" style="display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:4px;z-index:100;min-width:160px;box-shadow:0 4px 16px rgba(0,0,0,.3);">
              <a class="purge-option" data-type="curated" href="#" style="display:block;padding:8px 12px;color:#f87171;text-decoration:none;font-size:13px;border-radius:6px;">⚠️ Purge All Feed Articles</a>
            </div>
          </div>
        </div>
      </div>

      <!-- Filter Bar -->
      <button type="button" class="filter-bar-toggle" id="filterBarToggle" aria-expanded="false">
        <span>Filters</span><span aria-hidden="true">▾</span>
      </button>
      <div class="filter-bar filter-bar-collapsible collapsed" id="filterBar">
        <div class="filter-search-wrap">
          <span class="filter-search-icon">🔍</span>
          <input type="text" id="articleSearch" class="filter-search-input" placeholder="Search title or summary…" autocomplete="off" />
          <button class="filter-search-clear" id="clearSearch" style="display:none;" title="Clear search">✕</button>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="sourceFilter">Source</label>
          <select class="filter-select" id="sourceFilter">
            <option value="all">All</option>
          </select>
        </div>
        <div class="filter-group" id="categoryFilterGroup" style="display:none;">
          <label class="filter-label" for="categoryFilter">Category</label>
          <select class="filter-select" id="categoryFilter">
            <option value="all">All</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="dateFilter">Date</label>
          <select class="filter-select" id="dateFilter">
            <option value="all">All</option>
            <option value="24h">24h</option>
            <option value="7d">7d</option>
            <option value="30d">30d</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="statusFilter">Status</label>
          <select class="filter-select" id="statusFilter">
            <option value="all">All</option>
            <option value="published">Published</option>
            <option value="draft">Draft</option>
            <option value="review">Review</option>
            <option value="archived">Archived</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="scoreFilter">Score</label>
          <select class="filter-select" id="scoreFilter">
            <option value="all">All</option>
            <option value="high">High (≥7)</option>
            <option value="mid">Mid (5–6)</option>
            <option value="low">Low (&lt;5)</option>
            <option value="none">No score</option>
          </select>
        </div>
        <span class="filter-count" id="filterCount"></span>
      </div>

      <!-- Uncategorized notice banner -->
      <div id="uncatBanner" class="uncat-banner" style="display:none;">
        <span id="uncatBannerMsg"></span>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btn btn-sm btn-primary" id="uncatFixAllBtn">Fix all</button>
          <button class="btn btn-sm btn-ghost" id="uncatDismissBtn" title="Dismiss">✕</button>
        </div>
      </div>

      <!-- Bulk action toolbar -->
      <div id="bulkToolbar" class="bulk-toolbar" style="display:none;">
        <span id="bulkCount" class="bulk-count">0 selected</span>
        <button class="btn btn-sm btn-primary" id="bulkPitchBtn" title="Compose a pitch bundling selected sources">📋 Create pitch from selection</button>
        <select id="bulkPitchType" class="pitch-type-select" style="display:none;" title="Pitch type"></select>
        <button class="btn btn-sm btn-outline" id="bulkRecategorizeBtn" title="Re-run category detection on selected">🏷️ Recategorize</button>
        <button class="btn btn-sm btn-danger" id="bulkDeleteBtn">🗑️ Delete</button>
        <button class="btn btn-sm btn-ghost" id="bulkClearBtn">✕ Clear</button>
      </div>

      <!-- Table view -->
      <div class="table-wrap"><div class="table-scroll">
        <table id="inboxTable" class="feed-inbox-table">
          <thead>
            <tr>
              <th class="th-check">
                <input type="checkbox" id="selectAll" title="Select all" />
              </th>
              <th class="sortable th-title" data-col="title">Title <span class="sort-icon">⇅</span></th>
              <th class="sortable" data-col="source">Source <span class="sort-icon">⇅</span></th>
              <th class="sortable th-cat" data-col="category">Category <span class="sort-icon">⇅</span></th>
              <th class="sortable th-score" data-col="editorial_score">Score <span class="sort-icon">⇅</span></th>
              <th class="sortable th-date" data-col="created_at">Fetched <span class="sort-icon">↓</span></th>
              <th style="width:40px;"></th>
            </tr>
          </thead>
          <tbody id="inboxBody">
            <tr><td colspan="7" class="td-loading"><span class="spinner"></span></td></tr>
          </tbody>
        </table>
      </div></div>

      <div id="inboxPagination"></div>
    </div>
  </div>
</div>

<!-- Article Preview Modal -->
<div class="modal-overlay" id="articlePreviewModal">
  <div class="modal modal-xl modal-dark" style="max-width:860px;">
    <div class="modal-header">
      <div class="modal-title">Source Preview</div>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <div class="modal-body" id="articlePreviewBody" style="padding:0;max-height:80vh;overflow-y:auto;"></div>
    <div class="modal-footer" style="gap:8px;">
      <a id="previewSourceLink" href="#" target="_blank" rel="noopener" class="btn btn-outline btn-sm" style="display:none;">View source</a>
      <button class="btn btn-outline" data-close-modal>Close</button>
    </div>
  </div>
</div>

<!-- Purge confirm modal -->
<div class="modal-overlay" id="purgeConfirmModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">Purge Feed Articles</div>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <div class="modal-body">
      <p class="text-muted">This will <strong class="text-danger">permanently delete</strong> all feed/curated articles. Original and deep-dive articles will not be affected.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close-modal>Cancel</button>
      <button class="btn btn-danger" id="confirmPurgeBtn">Purge All</button>
    </div>
  </div>
</div>

<!-- Recategorize preview modal -->
<div class="modal-overlay" id="recategorizeModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Recategorize articles</div>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <div class="modal-body" id="recategorizePreview" style="max-height:60vh;overflow-y:auto;">Loading preview…</div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close-modal>Cancel</button>
      <button class="btn btn-primary" id="confirmRecategorizeBtn" style="display:none;">Apply Changes</button>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script src="/admin-mobile-nav.js"></script>
<script src="/notifications-bell.js"></script>
<script src="/discuss-picker.js"></script>
<script src="/feed-inbox-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Sign In</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">&#129302; Deep Feed<span>AI</span></div>
    <div class="login-sub">Admin Panel</div>

    <div class="login-error" id="loginError"></div>

    <!-- Local Login Section (shown/hidden based on /api/auth/methods) -->
    <div id="localLoginSection" style="display:none">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="loginUsername" placeholder="admin" autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div id="localLoginError" class="text-danger text-sm" style="display:none; margin-bottom: 12px;"></div>
      <button class="btn btn-primary" id="localLoginBtn" style="width:100%">Sign In</button>
    </div>

    <!-- Divider (shown when both local and OAuth are available) -->
    <div id="authDivider" style="display:none" class="auth-divider">
      <span>or continue with</span>
    </div>

    <!-- OAuth buttons -->
    <div id="oauthSection">
      <button class="btn btn-primary" id="googleBtn" style="width:100%;justify-content:center;gap:10px;padding:11px;font-size:14px;">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M17.64 9.2045c0-.6382-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9087c1.7018-1.5668 2.6836-3.874 2.6836-6.615z" fill="#000"/>
          <path d="M9 18c2.43 0 4.4673-.806 5.9564-2.1805l-2.9087-2.2581c-.8055.54-1.8354.859-3.0477.859-2.344 0-4.328-1.584-5.036-3.7104H.957v2.3318C2.4382 15.9832 5.4818 18 9 18z" fill="#000"/>
          <path d="M3.964 10.71C3.7836 10.17 3.6818 9.5945 3.6818 9s.1018-1.17.2822-1.71V4.9582H.957A8.9965 8.9965 0 0 0 0 9c0 1.4523.3477 2.8268.957 4.0418L3.964 10.71z" fill="#000"/>
          <path d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.426 0 9 0 5.4818 0 2.4382 2.0168.957 4.9582L3.964 7.29C4.672 5.1636 6.656 3.5795 9 3.5795z" fill="#000"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--muted);">
      Don't have a site yet? <a href="/signup.html" style="color:var(--accent);">Create one</a>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script src="/login-page.js"></script>
</body>
</html>

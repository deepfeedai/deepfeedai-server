<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Settings</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🤖 Deep Feed<span>AI</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Navigation</div>
      <a class="nav-link" href="/index.html"><span class="icon">📊</span> Dashboard</a>
      <a class="nav-link" href="/articles.html"><span class="icon">📰</span> Articles</a>
      <a class="nav-link" href="/sources.html"><span class="icon">📡</span> Sources</a>
      <a class="nav-link" href="/voices.html"><span class="icon">🎙️</span> Voices</a>
      <a class="nav-link active" href="/settings.html"><span class="icon">⚙️</span> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-link" data-logout><span class="icon">🚪</span> Logout</button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <div class="topbar-title">Settings</div>
    </header>

    <div class="page-body">
      <div id="alertArea"></div>

      <div class="section-header">
        <div class="section-title">Integrations</div>
      </div>

      <!-- ElevenLabs card -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:600px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
          <div style="font-size:28px;">🎙️</div>
          <div>
            <div style="font-weight:700;font-size:16px;">ElevenLabs</div>
            <div style="font-size:13px;color:var(--muted);">Text-to-speech for AI audio summaries</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">API Key</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="password" class="form-control" id="elApiKey" placeholder="sk_xxxxxxxxxxxxxxxxxxxxxxxx"
                   style="flex:1;" autocomplete="off" />
            <button class="btn btn-outline btn-sm" id="toggleApiKeyBtn" type="button" title="Show/hide">👁️</button>
          </div>
          <p style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;">
            Overrides the <code>ELEVENLABS_API_KEY</code> environment variable. Leave blank to use the environment variable.
          </p>
          <div id="apiKeyStatus" style="font-size:12px;color:var(--muted);margin-bottom:12px;"></div>
          <button class="btn btn-primary" id="saveElBtn">Save API Key</button>
        </div>
      </div>

    </div><!-- /page-body -->
  </div><!-- /main-content -->
</div><!-- /admin-layout -->

<script src="/admin.js"></script>
<script>
  let apiKeyVisible = false;

  async function loadSettings() {
    try {
      const settings = await apiFetch('/settings');
      const keyEl = document.getElementById('elApiKey');
      const statusEl = document.getElementById('apiKeyStatus');

      if (settings.elevenlabs_api_key) {
        // Show masked value
        keyEl.placeholder = '••••••••••••••••••••••••••••••••';
        statusEl.textContent = '✅ API key is set (leave blank to keep current value)';
        keyEl.value = ''; // Don't prefill — user must re-enter to change
      } else {
        statusEl.textContent = '⚠️ No API key set — using ELEVENLABS_API_KEY environment variable';
      }
    } catch (err) {
      showAlert('Failed to load settings: ' + err.message, 'error');
    }
  }

  document.getElementById('toggleApiKeyBtn').addEventListener('click', function() {
    const input = document.getElementById('elApiKey');
    apiKeyVisible = !apiKeyVisible;
    input.type = apiKeyVisible ? 'text' : 'password';
    this.textContent = apiKeyVisible ? '🙈' : '👁️';
  });

  document.getElementById('saveElBtn').addEventListener('click', async function() {
    const value = document.getElementById('elApiKey').value.trim();
    // If empty, we allow saving empty to clear the override
    try {
      await apiFetch('/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ elevenlabs_api_key: value })
      });
      showAlert(value ? 'API key saved ✓' : 'API key cleared — using environment variable');
      document.getElementById('elApiKey').value = '';
      await loadSettings();
    } catch (err) {
      showAlert('Save failed: ' + err.message, 'error');
    }
  });

  loadSettings();
</script>
</body>
</html>

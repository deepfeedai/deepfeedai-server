<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI — Reset Password</title>
  <link rel="stylesheet" href="/admin.css" />
  <script src="/theme-init.js"></script>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">&#129302; Deep Feed<span>AI</span></div>
    <div class="login-sub">Set a new password</div>

    <div class="login-error" id="resetError" style="display:none;"></div>

    <div id="resetForm">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" id="resetPassword" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="resetConfirm" placeholder="Repeat your password" minlength="8" autocomplete="new-password" />
      </div>
      <button class="btn btn-primary" id="resetBtn" style="width:100%">Reset Password</button>
    </div>

    <div id="resetSuccess" style="display:none;">
      <p style="color:var(--success);font-size:14px;text-align:center;margin-bottom:16px;">
        Password updated successfully.
      </p>
      <a href="/login.html" class="btn btn-primary" style="width:100%;text-align:center;display:block;">Sign In</a>
    </div>

    <div id="resetInvalid" style="display:none;">
      <p style="color:var(--danger);font-size:14px;text-align:center;margin-bottom:16px;">
        This reset link is invalid or has expired.
      </p>
      <a href="/forgot-password.html" class="btn btn-primary" style="width:100%;text-align:center;display:block;">Request a New Link</a>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script>
onReady(async () => {
  const errEl = document.getElementById('resetError');
  const form = document.getElementById('resetForm');
  const success = document.getElementById('resetSuccess');
  const invalid = document.getElementById('resetInvalid');
  const btn = document.getElementById('resetBtn');
  const passwordInput = document.getElementById('resetPassword');
  const confirmInput = document.getElementById('resetConfirm');

  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    form.style.display = 'none';
    invalid.style.display = 'block';
    return;
  }

  confirmInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btn.click();
  });

  btn.addEventListener('click', async () => {
    errEl.style.display = 'none';
    const password = passwordInput.value;
    const confirm = confirmInput.value;

    if (password.length < 8) {
      errEl.textContent = 'Password must be at least 8 characters';
      errEl.style.display = 'block';
      return;
    }
    if (password !== confirm) {
      errEl.textContent = 'Passwords do not match';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
      const res = await fetch('/api/user-auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });
      if (res.status === 429) throw new Error('Too many attempts. Please try again later.');
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) throw new Error('Server error. Please try again later.');
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 400 && data.error?.includes('expired')) {
          form.style.display = 'none';
          invalid.style.display = 'block';
          return;
        }
        throw new Error(data.error || 'Reset failed');
      }

      form.style.display = 'none';
      success.style.display = 'block';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  });
});
</script>
</body>
</html>

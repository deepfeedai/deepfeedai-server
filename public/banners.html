<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banners — Deep Feed AI</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    .banner-preview {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.6rem 1rem; border-radius: 6px; font-size: var(--text-sm);
      margin-top: 8px;
    }
    .banner-preview--info    { background: linear-gradient(90deg, #0ea5e9, #00d9ff, #a78bfa); color: #0f1117; }
    .banner-preview--warning { background: linear-gradient(90deg, #f59e0b, #fbbf24); color: #0f1117; }
    .banner-preview--error   { background: linear-gradient(90deg, #ef4444, #f87171); color: #fff; }
    .banner-preview--success { background: linear-gradient(90deg, #22c55e, #4ade80); color: #0f1117; }
    .banner-type-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: var(--text-xs); font-weight: 600; text-transform: uppercase;
    }
    .banner-type-badge--info    { background: #0ea5e9; color: #fff; }
    .banner-type-badge--warning { background: #f59e0b; color: #0f1117; }
    .banner-type-badge--error   { background: #ef4444; color: #fff; }
    .banner-type-badge--success { background: #22c55e; color: #0f1117; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <div class="main-content">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Menu">&#9776;</button>
        <div class="topbar-title">Banners</div>
        <span id="topbarUser" class="topbar-user"></span>
      </header>
      <div class="page-body">
        <div class="section-header">
          <div class="section-title">Site Banners</div>
          <button class="btn btn-primary" id="addBannerBtn">+ New Banner</button>
        </div>

        <p class="text-muted" style="margin-bottom:16px;">
          Banners appear at the top of your site for all visitors. Use them for announcements, maintenance notices, or promotions.
        </p>

        <!-- Active banners -->
        <div class="table-wrap">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Message</th>
                  <th class="th-center-sm">Type</th>
                  <th class="th-center-sm">Status</th>
                  <th class="th-center-sm">Schedule</th>
                  <th class="th-center-sm">Actions</th>
                </tr>
              </thead>
              <tbody id="bannersBody">
                <tr><td colspan="5"><div class="empty-state">Loading...</div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Add/Edit Banner Modal -->
        <div class="modal-overlay" id="bannerModal">
          <div class="modal">
            <div class="modal-header">
              <div class="modal-title" id="bannerModalTitle">New Banner</div>
              <button class="modal-close" data-close-modal>&#10005;</button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="bannerId" />

              <div class="form-group">
                <label class="form-label">Message</label>
                <textarea class="form-control" id="bannerMessage" rows="2" placeholder="Scheduled maintenance tonight at 2am UTC" style="resize:vertical;"></textarea>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Type</label>
                  <select class="form-control" id="bannerType">
                    <option value="info">Info (blue)</option>
                    <option value="warning">Warning (yellow)</option>
                    <option value="error">Error (red)</option>
                    <option value="success">Success (green)</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Priority</label>
                  <input type="number" class="form-control" id="bannerPriority" value="0" min="0" max="100" />
                  <div class="form-help">Higher = shown first</div>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Link Text (optional)</label>
                  <input type="text" class="form-control" id="bannerLinkText" placeholder="Learn more" />
                </div>
                <div class="form-group">
                  <label class="form-label">Link URL (optional)</label>
                  <input type="text" class="form-control" id="bannerLinkUrl" placeholder="/changelog" />
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Starts At (optional)</label>
                  <input type="datetime-local" class="form-control" id="bannerStartsAt" />
                </div>
                <div class="form-group">
                  <label class="form-label">Expires At (optional)</label>
                  <input type="datetime-local" class="form-control" id="bannerExpiresAt" />
                </div>
              </div>

              <div class="form-group" style="display:flex;align-items:center;gap:8px;">
                <input type="checkbox" id="bannerDismissible" checked />
                <label for="bannerDismissible" class="form-label" style="margin:0;">Dismissible by users</label>
              </div>

              <label class="form-label" style="margin-top:12px;">Preview</label>
              <div id="bannerPreview" class="banner-preview banner-preview--info">
                <span>Your banner message will appear here</span>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline" data-close-modal>Cancel</button>
              <button class="btn btn-primary" id="saveBannerBtn">Save</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="/admin.js"></script>
<script src="/admin-mobile-nav.js"></script>
<script src="/notifications-bell.js"></script>
  <script src="/banners-page.js"></script>
</body>
</html>

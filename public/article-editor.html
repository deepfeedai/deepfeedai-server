<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article Editor — DeepFeedAI Admin</title>
  <link rel="stylesheet" href="/admin.css" />
  <link rel="stylesheet" href="/chat-widget.css" />
  <link rel="stylesheet" href="/block-editor.css" />
<script>
// Read ?return= param and wire back button + permission-fail redirect
(function () {
  var ret = new URLSearchParams(location.search).get('return');
  if (!ret) return;
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('editorBackBtn');
    if (btn) btn.href = ret;
  });
  // Expose for block-editor.js to use on permission failure
  window._editorReturnUrl = ret;
})();
</script>
</head>
<body class="editor-page">

  <!-- Top Bar -->
  <header class="editor-topbar">
    <div class="editor-topbar-left">
      <a href="/articles.html" class="editor-back-btn" title="Back" id="editorBackBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <div class="editor-topbar-meta">
        <span class="editor-topbar-label" id="editorLabel">New Article</span>
        <span class="editor-topbar-status" id="editorStatus"></span>
      </div>
    </div>
    <div class="editor-topbar-right">
      <label class="editor-toggle-wrap">
        <label class="toggle">
          <input type="checkbox" id="editorPublished" />
          <span class="toggle-slider"></span>
        </label>
        <span class="editor-toggle-label">Published</span>
      </label>
      <button class="btn btn-outline btn-sm" id="editorPreviewBtn">Preview</button>
      <button class="btn btn-primary btn-sm" id="editorSaveBtn">Save</button>
    </div>
  </header>

  <!-- Main Layout: Editor + Sidebar -->
  <div class="editor-layout">

    <!-- Editor Canvas -->
    <main class="editor-canvas">
      <div class="editor-title-wrap">
        <textarea id="editorTitle" class="editor-title-input" placeholder="Article title..." autocomplete="off" rows="1"></textarea>
      </div>
      <div id="editorjs" class="editor-blocks"></div>
    </main>

    <!-- Metadata Sidebar -->
    <aside class="editor-sidebar" id="editorSidebar">
      <div class="editor-sidebar-content">
        <h3 class="editor-sidebar-heading">Metadata</h3>

        <div class="form-group">
          <label class="form-label" for="esSummary">Summary</label>
          <textarea class="form-control" id="esSummary" rows="3" placeholder="Short description for the feed..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="esCategory">Category</label>
          <select class="form-control" id="esCategory"></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="esAuthor">Author</label>
          <input class="form-control" type="text" id="esAuthor" placeholder="Author name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="esSource">Source Name</label>
          <input class="form-control" type="text" id="esSource" placeholder="e.g. The Verge" />
        </div>
        <div class="form-group">
          <label class="form-label" for="esSourceUrl">Source URL</label>
          <input class="form-control" type="url" id="esSourceUrl" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label class="form-label">Image</label>
          <input type="hidden" id="esImageUrl" />
          <div style="display:flex;gap:8px;align-items:center;">
            <span id="esImageStatus" class="text-muted text-sm" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">No image</span>
            <span class="btn btn-ghost btn-sm" id="esImageUploadBtn" style="cursor:pointer;">Upload</span>
            <span class="btn btn-ghost btn-sm" id="esImageClearBtn" style="cursor:pointer;display:none;">Clear</span>
            <input type="file" id="esImageUpload" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="esWriter">Writer</label>
          <select class="form-control" id="esWriter">
            <option value="">Unassigned</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Featured</label>
          <select class="form-control" id="esFeatured">
            <option value="0">Off</option>
            <option value="1">#1 — Top spot</option>
            <option value="2">#2 — Second</option>
            <option value="3">#3 — Third</option>
            <option value="4">#4 — Fourth</option>
            <option value="5">#5 — Fifth</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="esDisableSummary" />
            Disable AI Summary
          </label>
        </div>

        <!-- Actions panel — shown only when editing an existing article -->
        <div id="editorActions" style="display:none">
          <h3 class="editor-sidebar-heading" style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border-color)">Actions</h3>

          <!-- Status -->
          <div class="form-group">
            <label class="form-label">Status</label>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <button class="btn btn-outline btn-sm" id="actionTogglePublish" style="width:100%;justify-content:center;">Unpublish</button>
              <button class="btn btn-ghost btn-sm" id="actionArchive" style="width:100%;justify-content:center;">Archive</button>
            </div>
          </div>

          <!-- Rewrite -->
          <div class="form-group">
            <label class="form-label">Rewrite</label>
            <div style="display:flex;gap:6px;">
              <select class="form-control form-control-sm" id="actionRewriteMode" style="flex:1">
                <option value="headline">Headline</option>
                <option value="summary">Summary</option>
                <option value="full">Full body</option>
              </select>
              <button class="btn btn-ghost btn-sm" id="actionRewrite" style="white-space:nowrap">Go</button>
            </div>
          </div>

          <!-- AI Media -->
          <div class="form-group">
            <label class="form-label">AI Media</label>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <button class="btn btn-ghost btn-sm" id="actionGenAudio" style="width:100%;justify-content:center;">Generate Audio</button>
              <button class="btn btn-ghost btn-sm" id="actionGenThumbnail" style="width:100%;justify-content:center;">Regenerate Thumbnail</button>
              <button class="btn btn-ghost btn-sm" id="actionRegenerate" style="display:none;width:100%;justify-content:center;">Regenerate Article</button>
            </div>
          </div>

          <!-- Source panel (originals only) -->
          <div id="actionSourcePanel" class="form-group" style="display:none">
            <label class="form-label">Source Articles</label>
            <div id="actionSourceList" style="display:flex;flex-direction:column;gap:4px;"></div>
          </div>

          <!-- Utilities -->
          <div class="form-group">
            <label class="form-label">Utilities</label>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <button class="btn btn-ghost btn-sm" id="actionCopyLink" style="width:100%;justify-content:center;">Copy Share Link</button>
              <div id="actionReadingTime" class="text-muted text-sm" style="padding:4px 0;">Reading time: —</div>
            </div>
          </div>

          <!-- Add to Story -->
          <div class="form-group">
            <label class="form-label">Add to Story</label>
            <select class="form-control form-control-sm" id="actionStorySelect">
              <option value="">Loading stories…</option>
            </select>
            <button class="btn btn-ghost btn-sm" id="actionAddToStory" style="width:100%;margin-top:4px;justify-content:center;">Add to Story</button>
          </div>

          <!-- Danger zone -->
          <div class="form-group" style="margin-top:8px;padding-top:16px;border-top:1px solid var(--border-color)">
            <button class="btn btn-sm" id="actionDelete" style="width:100%;justify-content:center;background:transparent;border:1px solid #e53e3e;color:#e53e3e;">Delete Permanently</button>
          </div>
        </div>

      </div>
    </aside>

    <!-- Sidebar toggle — AFTER sidebar so CSS sibling selector works, OUTSIDE so overflow:hidden doesn't clip it -->
    <button class="editor-sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>

  <!-- Editor.js Core + Plugins (vendored locally — CSP blocks CDN) -->
  <script src="/vendor/editorjs/editorjs.umd.min.js"></script>
  <script src="/vendor/editorjs/header.umd.js"></script>
  <script src="/vendor/editorjs/list.umd.js"></script>
  <script src="/vendor/editorjs/quote.umd.js"></script>
  <script src="/vendor/editorjs/image.umd.js"></script>
  <script src="/vendor/editorjs/delimiter.umd.js"></script>
  <script src="/vendor/editorjs/embed.umd.js"></script>

  <script src="/admin.js"></script>
<script src="/notifications-bell.js"></script>
  <script src="/article-preview.js"></script>
  <script src="/block-editor.js"></script>
  <script src="/editor-assist.js"></script>
</body>
</html>

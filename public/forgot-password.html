<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI — Forgot Password</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">&#129302; Deep Feed<span>AI</span></div>
    <div class="login-sub">Reset your password</div>

    <div class="login-error" id="forgotError" style="display:none;"></div>

    <div id="forgotForm">
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px;">
        Enter the email you signed up with and we'll send a reset link.
      </p>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="forgotEmail" placeholder="you@example.com" autocomplete="email" />
      </div>
      <button class="btn btn-primary" id="forgotBtn" style="width:100%">Send Reset Link</button>
    </div>

    <div id="forgotSuccess" style="display:none;">
      <p style="color:var(--success);font-size:14px;text-align:center;margin-bottom:16px;">
        If an account with that email exists, we sent a reset link. Check your inbox.
      </p>
    </div>

    <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--muted);">
      <a href="/login.html" style="color:var(--accent);">&larr; Back to sign in</a>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script>
onReady(async () => {
  const errEl = document.getElementById('forgotError');
  const form = document.getElementById('forgotForm');
  const success = document.getElementById('forgotSuccess');
  const btn = document.getElementById('forgotBtn');
  const emailInput = document.getElementById('forgotEmail');

  emailInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btn.click();
  });

  btn.addEventListener('click', async () => {
    errEl.style.display = 'none';
    const email = emailInput.value.trim();
    if (!email) {
      errEl.textContent = 'Please enter your email';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      const res = await fetch('/api/user-auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      if (res.status === 429) throw new Error('Too many attempts. Please try again later.');
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) throw new Error('Server error. Please try again later.');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');

      form.style.display = 'none';
      success.style.display = 'block';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
    }
  });
});
</script>
</body>
</html>

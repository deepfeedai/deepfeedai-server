<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roles — Deep Feed AI</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    .permissions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }
    .perm-group {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .perm-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .perm-group-title {
      font-weight: 600;
      font-size: var(--text-sm);
      text-transform: uppercase;
      color: var(--accent);
    }
    .perm-group-all {
      font-size: var(--text-xs);
      color: var(--muted);
      cursor: pointer;
    }
    .perm-group-all:hover { color: var(--text); }
    .perm-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .perm-action {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: var(--text-sm);
    }
    .perm-action input[type="checkbox"] {
      accent-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <div class="main-content">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Menu">&#9776;</button>
        <div class="topbar-title">Roles &amp; Permissions</div>
        <span id="topbarUser" class="topbar-user"></span>
      </header>
      <div class="page-body">
        <div class="section-header">
          <div class="section-title">Roles</div>
          <button class="btn btn-primary" id="addRoleBtn">+ Add Role</button>
        </div>

        <!-- Roles table -->
        <div class="table-wrap">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Role</th>
                  <th>Description</th>
                  <th class="th-center-sm">Permissions</th>
                  <th class="th-center-sm">Type</th>
                  <th class="th-center-sm">Actions</th>
                </tr>
              </thead>
              <tbody id="rolesBody">
                <tr><td colspan="5"><div class="empty-state">Loading...</div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Add/Edit Role Modal -->
        <div class="modal-overlay" id="roleModal">
          <div class="modal modal-lg">
            <div class="modal-header">
              <div class="modal-title" id="roleModalTitle">Add Role</div>
              <button class="modal-close" data-close-modal>&#10005;</button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="roleId" />
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Role Name</label>
                  <input type="text" class="form-control" id="roleName" placeholder="e.g., moderator" />
                  <div class="form-help">Lowercase letters, numbers, hyphens</div>
                </div>
                <div class="form-group">
                  <label class="form-label">Description</label>
                  <input type="text" class="form-control" id="roleDescription" placeholder="Brief description" />
                </div>
              </div>

              <label class="form-label mt-4">Permissions</label>
              <div id="permissionsGrid" class="permissions-grid">
                <!-- Generated by JS -->
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline" data-close-modal>Cancel</button>
              <button class="btn btn-primary" id="saveRoleBtn">Save</button>
            </div>
          </div>
        </div>

        <!-- View Role Modal -->
        <div class="modal-overlay" id="viewRoleModal">
          <div class="modal modal-lg">
            <div class="modal-header">
              <div class="modal-title" id="viewRoleTitle">Role Details</div>
              <button class="modal-close" data-close-modal>&#10005;</button>
            </div>
            <div class="modal-body" id="viewRoleBody"></div>
            <div class="modal-footer">
              <button class="btn btn-outline" data-close-modal>Close</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/admin.js"></script>
  <script src="/roles-page.js"></script>
</body>
</html>

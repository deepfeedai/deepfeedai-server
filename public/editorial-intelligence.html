<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin - Editorial Intelligence</title>
  <link rel="stylesheet" href="/admin.css" />
  <script src="/theme-init.js"></script>
  <style>
    .ei-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .ei-date { background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:7px 10px; font:inherit; }
    .ei-layout { display:grid; grid-template-columns:minmax(0, 1fr) 380px; gap:16px; align-items:start; }
    .ei-list, .ei-detail { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
    .ei-list-head, .ei-detail-head { padding:12px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .ei-list-title, .ei-detail-title { font-weight:700; font-size:14px; }
    .ei-meta { color:var(--muted); font-size:12px; }
    .ei-cards { display:flex; flex-direction:column; }
    .ei-card { border:0; border-bottom:1px solid var(--border); background:transparent; color:var(--text); text-align:left; padding:14px; cursor:pointer; }
    .ei-card:hover, .ei-card.active { background:rgba(255,255,255,0.04); }
    .ei-card-title { font-weight:700; line-height:1.35; margin-bottom:8px; }
    .ei-card-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .ei-pill { display:inline-flex; align-items:center; padding:2px 7px; border-radius:999px; font-size:11px; font-weight:700; background:rgba(255,255,255,0.07); color:var(--muted); }
    .ei-pill-score { color:var(--accent); background:var(--accent-dim); }
    .ei-pill-approved { color:var(--success); background:var(--success-dim); }
    .ei-pill-rejected { color:var(--danger); background:var(--danger-dim); }
    .ei-detail-body { padding:14px; display:flex; flex-direction:column; gap:14px; }
    .ei-section-label { color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
    .ei-section-text { font-size:13px; line-height:1.5; }
    .ei-source { border:1px solid var(--border); border-radius:7px; padding:9px; margin-bottom:8px; }
    .ei-source-title { font-size:12px; font-weight:700; line-height:1.35; }
    .ei-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .ei-empty { padding:30px; text-align:center; color:var(--muted); }
    .ei-score-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .ei-score-row { background:rgba(255,255,255,0.04); border-radius:6px; padding:8px; font-size:12px; }
    .ei-score-row strong { display:block; color:var(--text); font-size:13px; }
    @media (max-width: 980px) { .ei-layout { grid-template-columns:1fr; } .ei-detail { position:static; } }
  </style>
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">Menu</button>
      <div class="topbar-title">Editorial Intelligence</div>
      <span id="topbarUser" class="topbar-user"></span>
    </header>

    <div class="page-body">
      <div class="section-header">
        <div>
          <div class="section-title">Story Planning</div>
          <div class="ei-meta" id="eiSummary">Ranked candidates and editor-ready story briefs</div>
        </div>
      </div>

      <div class="ei-toolbar">
        <input type="date" id="eiDate" class="ei-date" />
        <button class="btn btn-primary btn-sm" id="eiRunBtn">Run Planning Pass</button>
        <button class="btn btn-secondary btn-sm" id="eiRefreshBtn">Refresh</button>
        <a href="/budget.html" class="btn btn-ghost btn-sm">Open Runsheet</a>
      </div>

      <div class="ei-layout">
        <section class="ei-list">
          <div class="ei-list-head">
            <div class="ei-list-title">Candidates</div>
            <div class="ei-meta" id="eiCount">0</div>
          </div>
          <div class="ei-cards" id="eiCards">
            <div class="ei-empty">Loading...</div>
          </div>
        </section>

        <aside class="ei-detail">
          <div class="ei-detail-head">
            <div class="ei-detail-title">Brief</div>
            <div class="ei-meta" id="eiBriefStatus"></div>
          </div>
          <div class="ei-detail-body" id="eiDetail">
            <div class="ei-empty">Select a candidate.</div>
          </div>
        </aside>
      </div>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script src="/admin-mobile-nav.js"></script>
<script src="/editorial-intelligence-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Articles</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🤖 Deep Feed<span>AI</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Navigation</div>
      <a class="nav-link" href="/index.html"><span class="icon">📊</span> Dashboard</a>
      <a class="nav-link active" href="/articles.html"><span class="icon">📰</span> Articles</a>
      <a class="nav-link" href="/sources.html"><span class="icon">📡</span> Sources</a>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-link" data-logout><span class="icon">🚪</span> Logout</button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <div class="topbar-title">Articles</div>
    </header>

    <div class="page-body">
      <div id="alertArea"></div>

      <div class="section-header">
        <div class="section-title">All Articles</div>
        <button class="btn btn-primary" id="addArticleBtn">＋ Add Article</button>
      </div>

      <!-- Bulk action toolbar — hidden until rows are selected -->
      <div id="bulkToolbar" class="bulk-toolbar" style="display:none;">
        <span id="bulkCount" class="bulk-count">0 selected</span>
        <button class="btn btn-sm btn-outline" id="bulkPublishBtn">✅ Publish</button>
        <button class="btn btn-sm btn-outline" id="bulkUnpublishBtn">📄 Unpublish</button>
        <button class="btn btn-sm btn-danger" id="bulkDeleteBtn">🗑️ Delete</button>
        <button class="btn btn-sm btn-ghost" id="bulkClearBtn">✕ Clear</button>
      </div>

      <div class="table-wrap">
        <table id="articlesTable">
          <thead>
            <tr>
              <th class="th-check">
                <input type="checkbox" id="selectAll" title="Select all" />
              </th>
              <th class="sortable" data-col="title">Title <span class="sort-icon">⇅</span></th>
              <th class="sortable" data-col="source">Source <span class="sort-icon">⇅</span></th>
              <th class="sortable" data-col="category">Category <span class="sort-icon">⇅</span></th>
              <th class="sortable" data-col="is_published">Status <span class="sort-icon">⇅</span></th>
              <th class="sortable" data-col="is_featured">Featured <span class="sort-icon">⇅</span></th>
              <th class="sortable" data-col="published_at">Date <span class="sort-icon">⇅</span></th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="articlesBody">
            <tr><td colspan="8" style="text-align:center;padding:32px;color:var(--muted);">
              <span class="spinner"></span>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="articleModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Add Article</div>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId" />

      <!-- URL Auto-fill -->
      <div class="form-group autofill-group">
        <label class="form-label" for="fAutoUrl">🔗 Auto-fill from URL</label>
        <div class="autofill-row">
          <input class="form-control" type="url" id="fAutoUrl" placeholder="Paste article URL to auto-populate fields…" />
          <button class="btn btn-outline" id="autoFillBtn" type="button">Fetch</button>
        </div>
        <div id="autoFillStatus" class="autofill-status"></div>
      </div>
      <hr class="form-divider" />

      <div class="form-group">
        <label class="form-label" for="fTitle">Title *</label>
        <input class="form-control" type="text" id="fTitle" placeholder="Article title" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="fSummary">Summary</label>
        <textarea class="form-control" id="fSummary" rows="3" placeholder="Short description…"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="fCategory">Category</label>
          <select class="form-control" id="fCategory"></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="fAuthor">Author</label>
          <input class="form-control" type="text" id="fAuthor" placeholder="Author name" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="fSource">Source Name</label>
          <input class="form-control" type="text" id="fSource" placeholder="e.g. The Verge" />
        </div>
        <div class="form-group">
          <label class="form-label" for="fSourceUrl">Source URL</label>
          <input class="form-control" type="url" id="fSourceUrl" placeholder="https://…" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="fImageUrl">Image URL</label>
        <input class="form-control" type="url" id="fImageUrl" placeholder="https://…" />
      </div>
      <div style="display:flex;gap:24px;margin-top:8px;">
        <label class="form-check">
          <label class="toggle">
            <input type="checkbox" id="fPublished" checked />
            <span class="toggle-slider"></span>
          </label>
          <span class="form-check-label">Published</span>
        </label>
        <label class="form-check">
          <label class="toggle">
            <input type="checkbox" id="fFeatured" />
            <span class="toggle-slider"></span>
          </label>
          <span class="form-check-label">Featured</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close-modal>Cancel</button>
      <button class="btn btn-primary" id="saveArticleBtn">Save Article</button>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <div class="modal-title">Delete Article</div>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--muted);">Are you sure you want to delete this article? This cannot be undone.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close-modal>Cancel</button>
      <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script>
  let articles = [];
  let deleteTargetId = null;
  let sortCol = 'published_at';
  let sortDir = 'desc';
  let selectedIds = new Set();

  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function sortArticles(col) {
    if (sortCol === col) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortCol = col;
      sortDir = ['published_at','created_at'].includes(col) ? 'desc' : 'asc';
    }
    // Update sort icons
    document.querySelectorAll('.sortable').forEach(th => {
      const icon = th.querySelector('.sort-icon');
      if (th.dataset.col === sortCol) {
        icon.textContent = sortDir === 'asc' ? '↑' : '↓';
        th.classList.add('active-sort');
      } else {
        icon.textContent = '⇅';
        th.classList.remove('active-sort');
      }
    });
    articles.sort((a, b) => {
      let va = a[sortCol], vb = b[sortCol];
      if (va == null) va = '';
      if (vb == null) vb = '';
      if (['is_published','is_featured'].includes(sortCol)) {
        va = Number(va); vb = Number(vb);
      } else if (['published_at','created_at'].includes(sortCol)) {
        va = new Date(va); vb = new Date(vb);
      } else {
        va = String(va).toLowerCase(); vb = String(vb).toLowerCase();
      }
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    renderTable();
  }

  function updateBulkToolbar() {
    const toolbar = document.getElementById('bulkToolbar');
    const count   = document.getElementById('bulkCount');
    if (selectedIds.size > 0) {
      toolbar.style.display = 'flex';
      count.textContent = `${selectedIds.size} selected`;
    } else {
      toolbar.style.display = 'none';
    }
    // Sync select-all checkbox
    const all = document.getElementById('selectAll');
    if (all) all.checked = articles.length > 0 && selectedIds.size === articles.length;
  }

  function renderTable() {
    const tbody = document.getElementById('articlesBody');
    if (articles.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8">
        <div class="empty-state"><div class="empty-icon">📭</div><p>No articles yet. Add one!</p></div>
      </td></tr>`;
      updateBulkToolbar();
      return;
    }

    tbody.innerHTML = articles.map(a => `
      <tr id="row-${a.id}" class="${selectedIds.has(a.id) ? 'row-selected' : ''}">
        <td class="td-check">
          <input type="checkbox" class="row-check" data-id="${a.id}" ${selectedIds.has(a.id) ? 'checked' : ''} />
        </td>
        <td class="td-title" title="${escHtml(a.title)}">${escHtml(a.title)}</td>
        <td style="color:var(--muted);font-size:12px;">${escHtml(a.source || '—')}</td>
        <td><span class="badge badge-muted">${escHtml(a.category || '—')}</span></td>
        <td>
          <button class="badge ${a.is_published ? 'badge-success' : 'badge-muted'}"
            style="cursor:pointer;border:none;background:inherit;"
            onclick="togglePublish(${a.id})">
            ${a.is_published ? 'Published' : 'Draft'}
          </button>
        </td>
        <td>
          <button class="badge ${a.is_featured ? 'badge-accent' : 'badge-muted'}"
            style="cursor:pointer;border:none;background:inherit;"
            onclick="toggleFeature(${a.id})">
            ${a.is_featured ? '⭐ Yes' : '—'}
          </button>
        </td>
        <td style="color:var(--muted);font-size:12px;">${fmtDate(a.published_at || a.created_at)}</td>
        <td class="td-actions">
          <button class="btn btn-ghost btn-sm btn-icon" title="Edit" onclick="openEdit(${a.id})">✏️</button>
          <button class="btn btn-ghost btn-sm btn-icon" title="Delete" onclick="openDelete(${a.id})">🗑️</button>
        </td>
      </tr>
    `).join('');

    // Wire up row checkboxes
    tbody.querySelectorAll('.row-check').forEach(cb => {
      cb.addEventListener('change', () => {
        const id = parseInt(cb.dataset.id);
        if (cb.checked) selectedIds.add(id); else selectedIds.delete(id);
        const row = document.getElementById(`row-${id}`);
        if (row) row.classList.toggle('row-selected', cb.checked);
        updateBulkToolbar();
      });
    });

    updateBulkToolbar();
  }

  async function loadArticles() {
    try {
      articles = await apiFetch('/articles');
      // Re-apply current sort after reload
      articles.sort((a, b) => {
        let va = a[sortCol], vb = b[sortCol];
        if (va == null) va = ''; if (vb == null) vb = '';
        if (['is_published','is_featured'].includes(sortCol)) { va = Number(va); vb = Number(vb); }
        else if (['published_at','created_at'].includes(sortCol)) { va = new Date(va); vb = new Date(vb); }
        else { va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
        if (va < vb) return sortDir === 'asc' ? -1 : 1;
        if (va > vb) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });
      renderTable();
    } catch (err) {
      showAlert('Failed to load articles: ' + err.message, 'error');
    }
  }

  function openAdd() {
    document.getElementById('modalTitle').textContent = 'Add Article';
    document.getElementById('editId').value = '';
    document.getElementById('fAutoUrl').value = '';
    document.getElementById('autoFillStatus').textContent = '';
    document.getElementById('fTitle').value = '';
    document.getElementById('fSummary').value = '';
    document.getElementById('fCategory').innerHTML = categoryOptions('Industry');
    document.getElementById('fAuthor').value = '';
    document.getElementById('fSource').value = '';
    document.getElementById('fSourceUrl').value = '';
    document.getElementById('fImageUrl').value = '';
    document.getElementById('fPublished').checked = true;
    document.getElementById('fFeatured').checked = false;
    openModal('articleModal');
    document.getElementById('fAutoUrl').focus();
  }

  // Auto-fill form from URL
  document.getElementById('autoFillBtn').addEventListener('click', async () => {
    const url    = document.getElementById('fAutoUrl').value.trim();
    const status = document.getElementById('autoFillStatus');
    const btn    = document.getElementById('autoFillBtn');
    if (!url) return;

    btn.disabled = true;
    btn.textContent = 'Fetching…';
    status.textContent = '';
    status.className = 'autofill-status';

    try {
      const data = await apiFetch('/fetch-url?url=' + encodeURIComponent(url));

      // Populate fields — only overwrite if currently empty
      const set = (id, val) => { if (val) document.getElementById(id).value = val; };
      set('fTitle',     data.title);
      set('fSummary',   data.summary);
      set('fSource',    data.source);
      set('fSourceUrl', data.source_url);
      set('fImageUrl',  data.image);
      set('fAuthor',    data.author);
      if (data.category) document.getElementById('fCategory').innerHTML = categoryOptions(data.category);

      status.textContent = '✅ Fields populated — review and edit as needed.';
      status.className   = 'autofill-status success';
    } catch (err) {
      status.textContent = '❌ ' + err.message;
      status.className   = 'autofill-status error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Fetch';
    }
  });

  // Also trigger on Enter in the URL field
  document.getElementById('fAutoUrl').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('autoFillBtn').click(); }
  });

  function openEdit(id) {
    const a = articles.find(x => x.id === id);
    if (!a) return;
    document.getElementById('modalTitle').textContent = 'Edit Article';
    document.getElementById('editId').value = a.id;
    document.getElementById('fTitle').value = a.title || '';
    document.getElementById('fSummary').value = a.summary || '';
    document.getElementById('fCategory').innerHTML = categoryOptions(a.category);
    document.getElementById('fAuthor').value = a.author || '';
    document.getElementById('fSource').value = a.source || '';
    document.getElementById('fSourceUrl').value = a.source_url || '';
    document.getElementById('fImageUrl').value = a.image_url || '';
    document.getElementById('fPublished').checked = !!a.is_published;
    document.getElementById('fFeatured').checked = !!a.is_featured;
    openModal('articleModal');
    document.getElementById('fTitle').focus();
  }

  function openDelete(id) {
    deleteTargetId = id;
    openModal('deleteModal');
  }

  async function saveArticle() {
    const id    = document.getElementById('editId').value;
    const title = document.getElementById('fTitle').value.trim();
    if (!title) { showAlert('Title is required', 'error'); return; }

    const payload = {
      title,
      summary   : document.getElementById('fSummary').value.trim() || null,
      category  : document.getElementById('fCategory').value,
      author    : document.getElementById('fAuthor').value.trim() || null,
      source    : document.getElementById('fSource').value.trim() || null,
      source_url: document.getElementById('fSourceUrl').value.trim() || null,
      image_url : document.getElementById('fImageUrl').value.trim() || null,
      is_published: document.getElementById('fPublished').checked,
      is_featured : document.getElementById('fFeatured').checked,
    };

    try {
      const saveBtn = document.getElementById('saveArticleBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      if (id) {
        await apiFetch(`/articles/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
        showAlert('Article updated ✓');
      } else {
        await apiFetch('/articles', { method: 'POST', body: JSON.stringify(payload) });
        showAlert('Article created ✓');
      }
      closeModal('articleModal');
      await loadArticles();
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Article';
    } catch (err) {
      showAlert('Error: ' + err.message, 'error');
      document.getElementById('saveArticleBtn').disabled = false;
      document.getElementById('saveArticleBtn').textContent = 'Save Article';
    }
  }

  async function confirmDelete() {
    if (!deleteTargetId) return;
    try {
      await apiFetch(`/articles/${deleteTargetId}`, { method: 'DELETE' });
      selectedIds.delete(deleteTargetId);
      closeModal('deleteModal');
      showAlert('Article deleted');
      deleteTargetId = null;
      await loadArticles();
    } catch (err) {
      showAlert('Delete failed: ' + err.message, 'error');
    }
  }

  async function togglePublish(id) {
    try {
      await apiFetch(`/articles/${id}/publish`, { method: 'PUT' });
      await loadArticles();
    } catch (err) { showAlert('Error: ' + err.message, 'error'); }
  }

  async function toggleFeature(id) {
    try {
      await apiFetch(`/articles/${id}/feature`, { method: 'PUT' });
      await loadArticles();
    } catch (err) { showAlert('Error: ' + err.message, 'error'); }
  }

  // ── Bulk actions ────────────────────────────────────────────────────────────
  async function bulkSetPublish(val) {
    const ids = [...selectedIds];
    if (!ids.length) return;
    let done = 0;
    for (const id of ids) {
      const a = articles.find(x => x.id === id);
      if (a && a.is_published !== val) {
        await apiFetch(`/articles/${id}/publish`, { method: 'PUT' });
        done++;
      }
    }
    selectedIds.clear();
    showAlert(`${done} article(s) ${val ? 'published' : 'unpublished'} ✓`);
    await loadArticles();
  }

  async function bulkDelete() {
    const ids = [...selectedIds];
    if (!ids.length) return;
    if (!confirm(`Delete ${ids.length} article(s)? This cannot be undone.`)) return;
    let done = 0;
    for (const id of ids) {
      try { await apiFetch(`/articles/${id}`, { method: 'DELETE' }); done++; } catch {}
    }
    selectedIds.clear();
    showAlert(`${done} article(s) deleted`);
    await loadArticles();
  }

  onReady(async () => {
    if (!requireAuth()) return;
    initSidebar();
    initLogout();
    initModals();

    document.getElementById('fCategory').innerHTML = categoryOptions('Industry');
    document.getElementById('addArticleBtn').addEventListener('click', openAdd);
    document.getElementById('saveArticleBtn').addEventListener('click', saveArticle);
    document.getElementById('confirmDeleteBtn').addEventListener('click', confirmDelete);

    // Sortable column headers
    document.querySelectorAll('.sortable').forEach(th => {
      th.addEventListener('click', () => sortArticles(th.dataset.col));
    });

    // Select all checkbox
    document.getElementById('selectAll').addEventListener('change', e => {
      if (e.target.checked) {
        articles.forEach(a => selectedIds.add(a.id));
      } else {
        selectedIds.clear();
      }
      renderTable();
    });

    // Bulk toolbar buttons
    document.getElementById('bulkPublishBtn').addEventListener('click', () => bulkSetPublish(1));
    document.getElementById('bulkUnpublishBtn').addEventListener('click', () => bulkSetPublish(0));
    document.getElementById('bulkDeleteBtn').addEventListener('click', bulkDelete);
    document.getElementById('bulkClearBtn').addEventListener('click', () => {
      selectedIds.clear();
      renderTable();
    });

    await loadArticles();
  });
</script>
</body>
</html>

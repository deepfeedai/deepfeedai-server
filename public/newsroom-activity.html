<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Newsroom</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    .feed-shell { max-width:760px; margin:0 auto; padding:16px; }
    .feed-filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
    .feed-filters select, .feed-filters input { padding:6px 10px; border:1px solid var(--border); background:var(--bg-card); color:var(--text); border-radius:6px; font-size:13px; }
    .feed-stream { display:flex; flex-direction:column; gap:10px; }
    .feed-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
    .feed-card-header { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
    .feed-avatar { width:32px; height:32px; border-radius:50%; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--muted); flex-shrink:0; object-fit:cover; }
    .feed-actor { font-weight:600; font-size:13px; }
    .feed-time { font-size:12px; color:var(--muted); margin-left:auto; }
    .feed-dismiss-btn { background:none; border:none; color:var(--muted); cursor:pointer; padding:2px 4px; font-size:13px; line-height:1; border-radius:4px; flex-shrink:0; }
    .feed-dismiss-btn:hover { color:var(--text); background:var(--surface2); }
    .feed-event-tag { font-size:10px; text-transform:uppercase; letter-spacing:.5px; padding:2px 8px; border-radius:6px; font-weight:700; }
    .tag-published        { background:rgba(34,197,94,0.15);  color:#22c55e; }
    .tag-pitched          { background:rgba(124,58,237,0.15); color:#a78bfa; }
    .tag-pitch_approved   { background:rgba(34,197,94,0.15);  color:#22c55e; }
    .tag-pitch_rejected   { background:rgba(239,68,68,0.15);  color:#ef4444; }
    .tag-enriched         { background:rgba(251,191,36,0.15); color:#fbbf24; }
    .tag-standup          { background:rgba(14,165,233,0.15); color:#38bdf8; }
    .tag-editor_broadcast { background:rgba(249,115,22,0.15); color:#f97316; }
    .tag-daily_brief      { background:rgba(99,102,241,0.15); color:#818cf8; }
    .tag-weekly_digest    { background:rgba(168,85,247,0.15); color:#c084fc; }
    .feed-long-text { font-size:13px; color:var(--text); line-height:1.6; margin-top:6px; white-space:pre-wrap; word-wrap:break-word; }
    .feed-long-text.collapsed { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
    .feed-expand-btn { background:none; border:none; color:var(--primary); font-size:12px; cursor:pointer; padding:4px 0; }
    .broadcast-composer { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:16px; }
    .broadcast-composer textarea { width:100%; padding:10px 12px; border:1px solid var(--border); background:var(--bg-card); color:var(--text); border-radius:8px; resize:none; min-height:60px; max-height:120px; font-family:inherit; font-size:14px; box-sizing:border-box; }
    .broadcast-composer-footer { display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
    .broadcast-routing { font-size:12px; color:var(--muted); flex:1; }
    .maxwell-actions { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
    .feed-title { font-weight:700; font-size:15px; line-height:1.3; margin:4px 0; }
    .feed-snippet { font-size:13px; color:var(--text); line-height:1.55; margin-top:6px; }
    .feed-meta { font-size:11px; color:var(--muted); margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; }
    .feed-empty { text-align:center; padding:60px 20px; color:var(--muted); }
    .feed-link { font-size:12px; color:var(--primary); text-decoration:none; }
    .feed-actions { display:flex; gap:6px; margin-top:10px; padding-top:8px; border-top:1px solid var(--border); align-items:center; flex-wrap:wrap; }
    .react-btn { background:none; border:1px solid var(--border); padding:2px 8px; border-radius:14px; cursor:pointer; font-size:13px; color:var(--text); }
    .react-btn:hover { background:var(--surface2); }
    .react-btn.has-count { background:var(--surface2); }
    .reply-toggle { background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; margin-left:auto; }
    .reply-toggle:hover { color:var(--text); }
    .reply-thread { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); display:none; }
    .reply-thread.open { display:block; }
    .reply-item { padding:8px 0; font-size:13px; }
    .reply-author { font-weight:600; }
    .reply-time { font-size:11px; color:var(--muted); margin-left:8px; }
    .reply-input-row { display:flex; gap:6px; margin-top:8px; }
    .reply-input-row input { flex:1; padding:6px 10px; border:1px solid var(--border); background:var(--bg-card); color:var(--text); border-radius:6px; font-size:13px; }

    /* Structured brief (v2) rendering */
    .brief-headline { font-size:14px; font-weight:700; color:var(--text); margin:10px 0 6px; letter-spacing:-0.01em; }
    .brief-metrics { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 12px; }
    .brief-metric { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; min-width:90px; flex:0 0 auto; }
    .brief-metric-value { font-size:18px; font-weight:700; line-height:1.1; }
    .brief-metric-label { font-size:11px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:0.3px; }
    .brief-metric-trend { font-size:10px; font-weight:600; display:inline-block; margin-top:3px; padding:1px 6px; border-radius:4px; }
    .brief-trend-good { color:#22c55e; background:rgba(34,197,94,0.12); }
    .brief-trend-bad  { color:#ef4444; background:rgba(239,68,68,0.12); }
    .brief-priority { display:flex; align-items:center; gap:10px; background:rgba(251,191,36,0.10); border:1px solid rgba(251,191,36,0.35); border-radius:10px; padding:10px 12px; margin:8px 0 12px; color:var(--text); text-decoration:none; font-size:13px; }
    .brief-priority:hover { background:rgba(251,191,36,0.15); }
    .brief-priority-icon { font-size:16px; }
    .brief-priority-label { flex:1; font-weight:600; }
    .brief-priority-cta { color:#fbbf24; font-size:12px; font-weight:600; white-space:nowrap; }
    .brief-section { margin:12px 0; }
    .brief-section-title { font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); font-weight:700; margin-bottom:6px; }
    .brief-list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:2px; }
    .brief-list li a, .brief-list li { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; font-size:13px; color:var(--text); text-decoration:none; }
    .brief-list li a:hover { background:var(--surface2); }
    .brief-list-icon { width:16px; text-align:center; color:var(--muted); }
    .brief-list-title { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brief-list-meta { font-size:11px; color:var(--muted); }
    .brief-gaps { display:flex; flex-wrap:wrap; gap:6px; }
    .brief-gap-chip { font-size:12px; background:rgba(239,68,68,0.10); color:#ef4444; border:1px solid rgba(239,68,68,0.25); padding:3px 8px; border-radius:999px; }
    .brief-actions { display:flex; flex-wrap:wrap; gap:6px; }
    .brief-action-btn { font-size:12px; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:5px 10px; border-radius:6px; text-decoration:none; }
    .brief-action-btn:hover { background:var(--bg-card); border-color:var(--primary); }
  </style>
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <div class="topbar">
      <button class="hamburger" id="hamburger">&#9776;</button>
      <div class="topbar-title">Newsroom</div>
    </div>
    <div class="feed-shell">
      <!-- Broadcast composer -->
      <div class="broadcast-composer">
        <textarea id="broadcastInput" placeholder="Post to the newsroom… writers will respond based on their beats" rows="2"></textarea>
        <div class="broadcast-composer-footer">
          <span class="broadcast-routing" id="broadcastRouting"></span>
          <button class="btn btn-primary btn-sm" id="broadcastBtn">Post to Newsroom</button>
        </div>
      </div>
      <!-- Maxwell actions -->
      <div class="maxwell-actions">
        <button class="btn btn-outline btn-sm" id="briefBtn" title="Maxwell generates an end-of-day editorial brief">📋 Generate Day Brief</button>
        <button class="btn btn-outline btn-sm" id="digestBtn" title="Maxwell generates a week-in-review digest">📰 Generate Week in Review</button>
      </div>
      <div class="feed-filters">
        <label for="typeFilter">Show:</label>
        <select id="typeFilter">
          <option value="">All events</option>
          <option value="published">Published articles</option>
          <option value="pitched">Pitches</option>
          <option value="pitch_approved,pitch_rejected">Pitch decisions</option>
          <option value="enriched">External research</option>
          <option value="standup">Standups</option>
          <option value="editor_broadcast">Editor broadcasts</option>
          <option value="daily_brief">Day briefs</option>
          <option value="weekly_digest">Week in review</option>
        </select>
        <label for="daysFilter">Last:</label>
        <select id="daysFilter">
          <option value="1">24h</option>
          <option value="7" selected>7d</option>
          <option value="30">30d</option>
          <option value="90">90d</option>
        </select>
        <button class="btn btn-outline btn-sm" id="refreshBtn">↻ Refresh</button>
      </div>
      <div class="feed-stream" id="feedStream">
        <div class="feed-empty">Loading…</div>
      </div>
    </div>
  </div>
</div>
<script src="/admin.js"></script>
<script src="/admin-mobile-nav.js"></script>
<script src="/notifications-bell.js"></script>
<script src="/newsroom-activity-page.js"></script>
</body>
</html>

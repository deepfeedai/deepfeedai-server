<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Newsroom Feed</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    .feed-container { max-width:700px; }
    .feed-item { display:flex; gap:12px; padding:16px 0; border-bottom:1px solid var(--border); }
    .feed-item:last-child { border-bottom:none; }
    .feed-avatar { width:36px; height:36px; border-radius:50%; object-fit:cover; flex-shrink:0; }
    .feed-avatar-placeholder { width:36px; height:36px; border-radius:50%; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
    .feed-body { flex:1; min-width:0; }
    .feed-header { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
    .feed-name { font-weight:700; font-size:14px; }
    .feed-type { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; padding:2px 6px; border-radius:4px; }
    .feed-type-coordination { background:rgba(59,130,246,0.15); color:#3b82f6; }
    .feed-type-editorial-review { background:rgba(168,85,247,0.15); color:#a855f7; }
    .feed-type-pitch { background:rgba(34,197,94,0.15); color:#22c55e; }
    .feed-type-admin { background:rgba(251,191,36,0.15); color:#fbbf24; }
    .feed-time { font-size:11px; color:var(--muted); margin-left:auto; }
    .feed-content { font-size:13px; color:var(--text); line-height:1.5; }
    .feed-target { font-size:12px; color:var(--muted); margin-top:4px; }
    .feed-empty { text-align:center; padding:60px 20px; color:var(--muted); }
    .feed-filters { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .feed-filter { padding:6px 14px; border-radius:20px; font-size:12px; border:1px solid var(--border); background:none; color:var(--muted); cursor:pointer; }
    .feed-filter.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  </style>
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <div class="topbar">
      <button class="hamburger" id="hamburger">&#9776;</button>
      <div class="topbar-title">Newsroom Feed</div>
    </div>
    <div class="page-content feed-container">
      <div class="feed-filters" id="feedFilters">
        <button class="feed-filter active" data-type="all">All</button>
        <button class="feed-filter" data-type="editorial-review">Editorial</button>
        <button class="feed-filter" data-type="coordination">Coordination</button>
        <button class="feed-filter" data-type="pitch">Pitches</button>
      </div>
      <div id="feedList">
        <div class="feed-empty">Loading...</div>
      </div>
    </div>
  </div>
</div>
<script src="/admin.js"></script>
<script src="/newsroom-feed-page.js"></script>
</body>
</html>

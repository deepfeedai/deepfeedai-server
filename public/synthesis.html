<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Synthesis</title>
  <link rel="stylesheet" href="/admin.css" />
  <script src="/theme-init.js"></script>
  <style>
    .cluster-table { width: 100%; }
    .cluster-table th, .cluster-table td { padding: 8px 12px; text-align: left; }
    .cluster-table th { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
    .result-item { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .result-item:last-child { border-bottom: none; }
    .controls-bar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
    .controls-bar .form-group { margin-bottom: 0; min-width: 200px; }
    .stat-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-pill { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; display: flex; flex-direction: column; align-items: center; min-width: 100px; }
    .stat-pill .stat-value { font-size: 20px; font-weight: 700; }
    .stat-pill .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
    .cooldown-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .cooldown-ready { background: rgba(34,197,94,0.12); color: #22c55e; }
    .cooldown-active { background: rgba(251,146,60,0.12); color: #fb923c; }
    .dedup-warn { color: #f59e0b; font-weight: 600; font-size: 12px; }
    .dedup-ok { color: #22c55e; font-size: 12px; }
    .source-list { margin: 4px 0 0 0; padding: 0 0 0 20px; font-size: 12px; color: var(--text-muted); }
    .source-list li { margin-bottom: 2px; }
    .source-list a { color: var(--link); text-decoration: none; }
    .source-list a:hover { text-decoration: underline; }
    .expand-toggle { cursor: pointer; user-select: none; color: var(--link); font-size: 12px; }
    .strength-high { color: #22c55e; font-weight: 600; }
    .strength-med { color: #f59e0b; font-weight: 600; }
    .strength-low { color: #94a3b8; font-weight: 600; }
    .proposed-headline { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 2px; }
  </style>
</head>
<body>
<div class="admin-layout">
  <!-- Main -->
  <main class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">&#9776;</button>
      <div class="topbar-title">Synthesis</div>
      <span id="topbarUser" class="topbar-user"></span>
    </header>
    <div class="page-header">
      <div>
        <h1 class="page-title">Synthesis</h1>
        <p class="page-subtitle">Cluster related articles and generate original analytical pieces</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-bar">
      <div class="form-group">
        <label class="form-label">Writer</label>
        <select id="writerSelect" class="form-control">
          <option value="">Loading writers...</option>
        </select>
      </div>
      <button class="btn btn-outline" id="previewBtn">Preview Clusters</button>
      <button class="btn btn-outline" id="dryRunBtn">Dry Run</button>
      <button class="btn btn-primary" id="runBtn">Run Synthesis</button>
      <button class="btn btn-outline" id="runAllBtn">Run All Writers</button>
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:0.82rem;color:var(--muted);margin-left:8px;cursor:pointer;">
        <input type="checkbox" id="forceCheck"> Force (bypass cooldown &amp; dedup)
      </label>
    </div>

    <!-- Dry Run / Preview Stats -->
    <div id="statsSection" style="display:none;">
      <div class="stat-row" id="statsRow"></div>
    </div>

    <!-- Preview clusters -->
    <div class="card-section" id="clusterSection" style="display:none;">
      <div class="section-header">
        <h2 class="section-title">Cluster Preview</h2>
        <span class="text-muted text-sm" id="clusterWriterLabel"></span>
      </div>
      <div style="overflow-x:auto;">
        <table class="data-table cluster-table" id="clusterTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Topic</th>
              <th>Articles</th>
              <th>Strength</th>
              <th>Sources</th>
              <th>Dedup</th>
            </tr>
          </thead>
          <tbody id="clusterTbody">
          </tbody>
        </table>
      </div>
    </div>

    <!-- Results -->
    <div class="card-section" style="margin-top:16px;padding:12px 16px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:12px;">
      <span style="font-size:0.82rem;color:var(--muted);flex:1;">Remove all AI-generated original articles (useful for testing)</span>
      <button class="btn btn-danger" id="purgeBtn" style="font-size:0.82rem;padding:6px 14px;">Purge Originals</button>
    </div>

    <div class="card-section" id="resultSection" style="display:none;margin-top:20px;">
      <div class="section-header">
        <h2 class="section-title">Results</h2>
      </div>
      <div id="resultBody" style="padding:16px;"></div>
    </div>
  </main>
</div>

<script src="/admin.js"></script>
<script src="/admin-mobile-nav.js"></script>
<script src="/notifications-bell.js"></script>
<script src="/synthesis-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Synthesis</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    .cluster-table { width: 100%; }
    .cluster-table th, .cluster-table td { padding: 8px 12px; text-align: left; }
    .cluster-table th { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
    .result-item { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .result-item:last-child { border-bottom: none; }
    .controls-bar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
    .controls-bar .form-group { margin-bottom: 0; min-width: 200px; }
  </style>
</head>
<body>
<div class="admin-layout">
  <!-- Main -->
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Synthesis</h1>
        <p class="page-subtitle">Cluster related articles and generate original analytical pieces</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-bar">
      <div class="form-group">
        <label class="form-label">Writer</label>
        <select id="writerSelect" class="form-control">
          <option value="">Loading writers...</option>
        </select>
      </div>
      <button class="btn btn-outline" id="previewBtn">Preview Clusters</button>
      <button class="btn btn-primary" id="runBtn">Run Synthesis</button>
      <button class="btn btn-outline" id="runAllBtn">Run All Writers</button>
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:0.82rem;color:var(--muted);margin-left:8px;cursor:pointer;">
        <input type="checkbox" id="forceCheck"> Force (bypass cooldown &amp; dedup)
      </label>
    </div>

    <!-- Preview clusters -->
    <div class="card-section" id="clusterSection" style="display:none;">
      <div class="section-header">
        <h2 class="section-title">Cluster Preview</h2>
        <span class="text-muted text-sm" id="clusterWriterLabel"></span>
      </div>
      <div style="overflow-x:auto;">
        <table class="data-table cluster-table" id="clusterTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Topic</th>
              <th>Articles</th>
            </tr>
          </thead>
          <tbody id="clusterTbody">
          </tbody>
        </table>
      </div>
    </div>

    <!-- Results -->
    <div class="card-section" style="margin-top:16px;padding:12px 16px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:12px;">
      <span style="font-size:0.82rem;color:var(--muted);flex:1;">🧹 Remove all AI-generated original articles (useful for testing)</span>
      <button class="btn btn-danger" id="purgeBtn" style="font-size:0.82rem;padding:6px 14px;">Purge Originals</button>
    </div>

    <div class="card-section" id="resultSection" style="display:none;margin-top:20px;">
      <div class="section-header">
        <h2 class="section-title">Results</h2>
      </div>
      <div id="resultBody" style="padding:16px;"></div>
    </div>
  </main>
</div>

<script src="/admin.js"></script>
<script src="/synthesis-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Notifications</title>
  <link rel="stylesheet" href="/admin.css" />
  <script src="/theme-init.js"></script>
  <style>
    .notif-page { max-width: 820px; }
    .notif-tabs { display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--border); }
    .notif-tab { padding:10px 16px; background:none; border:none; border-bottom:2px solid transparent;
      color:var(--muted); cursor:pointer; font-weight:600; }
    .notif-tab.active { color:var(--text); border-bottom-color:var(--primary); }
    .notif-tab .badge { margin-left:6px; }
    .notif-toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .notif-day-header { font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
      color:var(--muted); margin:24px 0 10px; font-weight:700; }
    .notif-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px;
      padding:16px; margin-bottom:10px; }
    .notif-card.unread { border-left:3px solid var(--primary); }
    .notif-card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:6px; }
    .notif-card-title { font-weight:700; font-size:15px; color:var(--text); flex:1; }
    .notif-card-time { color:var(--muted); font-size:12px; white-space:nowrap; }
    .notif-card-body { color:var(--muted); font-size:14px; line-height:1.5; margin-bottom:10px; }
    .notif-card-kind { display:inline-block; padding:2px 8px; border-radius:6px;
      background:var(--surface2); color:var(--muted); font-size:11px; text-transform:uppercase;
      letter-spacing:0.04em; margin-right:8px; }
    .notif-card-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .notif-empty { text-align:center; padding:60px 20px; color:var(--muted); }
    .notif-load-more { display:block; width:100%; margin-top:16px; padding:10px;
      background:var(--surface2); border:1px solid var(--border); color:var(--text);
      border-radius:8px; cursor:pointer; font-weight:500; }
    .notif-load-more:disabled { opacity:0.6; cursor:not-allowed; }
  </style>
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <div class="topbar">
      <button class="hamburger" id="hamburger">&#9776;</button>
      <div class="topbar-title">Notifications</div>
    </div>
    <div class="page-content notif-page">
      <div class="notif-toolbar">
        <div class="notif-tabs">
          <button class="notif-tab active" data-tab="unread">Unread <span class="badge" id="notifUnreadCount"></span></button>
          <button class="notif-tab" data-tab="all">All</button>
        </div>
        <button class="btn btn-outline btn-sm" id="notifMarkAllBtn">Mark all as read</button>
      </div>

      <div id="notifFlagBanner" style="display:none;"></div>

      <div id="notifContent">
        <div class="notif-empty">Loading…</div>
      </div>

      <button class="notif-load-more" id="notifLoadMore" style="display:none;">Load more</button>
    </div>
  </div>
</div>
<script src="/admin.js"></script>
<script src="/admin-mobile-nav.js"></script>
<script src="/notifications-page.js"></script>
<script src="/notifications-bell.js"></script>
</body>
</html>

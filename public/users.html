<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Users — Deep Feed AI</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <div class="admin-layout">
    <div class="main-content">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Menu">&#9776;</button>
        <div class="topbar-title">Users</div>
        <span id="topbarUser" class="topbar-user"></span>
      </header>
      <div class="page-body">
        <div class="section-header">
          <div class="section-title">Local Admin Users</div>
          <button class="btn btn-primary" id="addUserBtn">+ Add User</button>
        </div>

        <div class="table-wrap">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Username</th>
                  <th>Display Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Last Login</th>
                  <th class="th-center-sm">Actions</th>
                </tr>
              </thead>
              <tbody id="usersBody">
                <tr><td colspan="7"><div class="empty-state">Loading...</div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Add/Edit User Modal -->
        <div class="modal-overlay" id="userModal">
          <div class="modal modal-md">
            <div class="modal-header">
              <div class="modal-title" id="userModalTitle">Add User</div>
              <button class="modal-close" data-close-modal>&#10005;</button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="userId" />
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Username</label>
                  <input type="text" class="form-control" id="userUsername" placeholder="johndoe" />
                  <div class="form-help">3-50 characters, letters, numbers, underscores</div>
                </div>
                <div class="form-group">
                  <label class="form-label">Display Name</label>
                  <input type="text" class="form-control" id="userDisplayName" placeholder="John Doe" />
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="userEmail" placeholder="john@example.com" />
              </div>
              <div class="form-group" id="passwordGroup">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="userPassword" placeholder="Minimum 8 characters" />
              </div>
              <div class="form-group">
                <label class="form-label">Role</label>
                <select class="form-control" id="userRole"></select>
              </div>
              <div class="form-group" id="activeGroup" style="display:none">
                <label class="form-check">
                  <input type="checkbox" id="userActive" checked /> Active
                </label>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline" data-close-modal>Cancel</button>
              <button class="btn btn-primary" id="saveUserBtn">Save</button>
            </div>
          </div>
        </div>

        <!-- Reset Password Modal -->
        <div class="modal-overlay" id="resetPwModal">
          <div class="modal modal-sm">
            <div class="modal-header">
              <div class="modal-title">Reset Password</div>
              <button class="modal-close" data-close-modal>&#10005;</button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="resetUserId" />
              <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" id="resetPassword" placeholder="Minimum 8 characters" />
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline" data-close-modal>Cancel</button>
              <button class="btn btn-danger" id="resetPwBtn">Reset Password</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/admin.js"></script>
<script src="/notifications-bell.js"></script>
  <script src="/users-page.js"></script>
</body>
</html>

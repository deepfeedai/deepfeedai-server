    <nav class="sidebar-nav">

      <a class="nav-link" href="/sources.html"><svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12.75 19.5v-.75a7.5 7.5 0 00-7.5-7.5H4.5m0-6.75h.75c7.87 0 14.25 6.38 14.25 14.25v.75M6 18.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" /></svg> Sources</a>
      <a class="nav-link" href="/voices.html"><svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" /></svg> Voices</a>
      <a class="nav-link active" href="/comments.html"><svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 01-.825-.242m9.345-8.334a2.126 2.126 0 00-.476-.095 48.64 48.64 0 00-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0011.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155" /></svg> Comments</a>
      <a class="nav-link" href="/settings.html"><svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-link" data-logout><svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" /></svg> Logout</button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <div class="topbar-title">Comments</div>
      <span id="topbarUser" class="topbar-user"></span>
    </header>

    <div class="page-body">


      <!-- Stat Cards -->
      <div class="dash-section-label">Overview</div>
      <div class="stat-grid" style="grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 28px;">
        <div class="stat-card">
          <div class="stat-icon">💬</div>
          <div class="stat-label">Total Comments</div>
          <div class="stat-value" id="statTotal">—</div>
        </div>
        <div class="stat-card" id="statFlaggedCard">
          <div class="stat-icon">🚩</div>
          <div class="stat-label">Flagged</div>
          <div class="stat-value" id="statFlagged">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-label">Unique Commenters</div>
          <div class="stat-value" id="statUsers">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🗑️</div>
          <div class="stat-label">Deleted</div>
          <div class="stat-value" id="statDeleted">—</div>
        </div>
      </div>

      <!-- Tab bar -->
      <div class="section-header" style="margin-bottom: 12px;">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-sm btn-ghost filter-tab active" data-filter="all">All</button>
          <button class="btn btn-sm btn-ghost filter-tab" data-filter="reported">🚩 Reported</button>
          <button class="btn btn-sm btn-ghost filter-tab" data-filter="queue" id="queueTab">
            ⏳ Queue <span id="queueBadge" style="display:none;background:var(--accent);color:#000;border-radius:10px;padding:0 6px;font-size:11px;font-weight:700;margin-left:4px;"></span>
          </button>
        </div>
        <input type="text" id="slugFilter" class="form-control filter-slug-input" placeholder="Filter by slug…" />
      </div>

      <!-- Comments table -->
      <div class="table-wrap">
        <table id="commentsTable">
          <thead>
            <tr>
              <th style="width:140px;">Article</th>
              <th>Comment</th>
              <th style="width:130px;">User</th>
              <th style="width:70px;">Reports</th>
              <th style="width:100px;">Date</th>
              <th style="width:100px;">Actions</th>
            </tr>
          </thead>
          <tbody id="commentsBody">
            <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:32px;">
              <span class="spinner"></span>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal" style="max-width:380px;">
    <div class="modal-header">
      <div class="modal-title" id="confirmTitle">Confirm</div>
    </div>
    <div class="modal-body">
      <p id="confirmMsg" style="color:var(--muted);margin:0;"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('confirmModal')">Cancel</button>
      <button class="btn btn-danger" id="confirmOkBtn">Confirm</button>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script src="/comments-page.js"></script>
</body>
</html>

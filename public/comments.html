<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Comments</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
<div class="admin-layout">
  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <div class="topbar-title">Comments</div>
      <span id="topbarUser" class="topbar-user"></span>
    </header>

    <div class="page-body">


      <!-- Stat Cards -->
      <div class="dash-section-label">Overview</div>
      <div class="stat-grid" style="grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 28px;">
        <div class="stat-card">
          <div class="stat-icon">💬</div>
          <div class="stat-label">Total Comments</div>
          <div class="stat-value" id="statTotal">—</div>
        </div>
        <div class="stat-card" id="statFlaggedCard">
          <div class="stat-icon">🚩</div>
          <div class="stat-label">Flagged</div>
          <div class="stat-value" id="statFlagged">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-label">Unique Commenters</div>
          <div class="stat-value" id="statUsers">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🗑️</div>
          <div class="stat-label">Deleted</div>
          <div class="stat-value" id="statDeleted">—</div>
        </div>
      </div>

      <!-- Tab bar -->
      <div class="section-header" style="margin-bottom: 12px;">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-sm btn-ghost filter-tab active" data-filter="all">All</button>
          <button class="btn btn-sm btn-ghost filter-tab" data-filter="reported">🚩 Reported</button>
          <button class="btn btn-sm btn-ghost filter-tab" data-filter="queue" id="queueTab">
            ⏳ Queue <span id="queueBadge" style="display:none;background:var(--accent);color:#000;border-radius:10px;padding:0 6px;font-size:11px;font-weight:700;margin-left:4px;"></span>
          </button>
        </div>
        <input type="text" id="slugFilter" class="form-control filter-slug-input" placeholder="Filter by slug…" />
      </div>

      <!-- Comments table -->
      <div id="cmtBulkToolbar" class="bulk-toolbar" style="display:none;">
        <span class="bulk-count" id="cmtBulkCount">0 selected</span>
        <button class="btn btn-success btn-sm" id="cmtBulkApprove">✓ Approve</button>
        <button class="btn btn-ghost btn-sm" id="cmtBulkHide">🙈 Hide</button>
        <button class="btn btn-danger btn-sm" id="cmtBulkDelete">🗑️ Delete</button>
        <button class="btn btn-ghost btn-sm" id="cmtBulkClear">✕ Clear</button>
      </div>

      <div class="table-wrap"><div class="table-scroll">
        <table id="commentsTable">
          <thead>
            <tr>
              <th class="th-check"><input type="checkbox" id="cmtSelectAll" title="Select all" /></th>
              <th style="width:140px;">Article</th>
              <th>Comment</th>
              <th style="width:130px;">User</th>
              <th style="width:70px;">Reports</th>
              <th style="width:100px;">Date</th>
              <th style="width:100px;">Actions</th>
            </tr>
          </thead>
          <tbody id="commentsBody">
            <tr><td colspan="7" style="text-align:center;color:var(--muted);padding:32px;">
              <span class="spinner"></span>
            </td></tr>
          </tbody>
        </table>
      </div></div>
      <div id="commentsPagination"></div>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal" style="max-width:380px;">
    <div class="modal-header">
      <div class="modal-title" id="confirmTitle">Confirm</div>
    </div>
    <div class="modal-body">
      <p id="confirmMsg" style="color:var(--muted);margin:0;"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('confirmModal')">Cancel</button>
      <button class="btn btn-danger" id="confirmOkBtn">Confirm</button>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script src="/admin-mobile-nav.js"></script>
<script src="/notifications-bell.js"></script>
<script src="/comments-page.js"></script>
</body>
</html>

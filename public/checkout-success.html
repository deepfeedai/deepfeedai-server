<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI — Completing Setup</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    .checkout-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .checkout-container {
      text-align: center;
      max-width: 420px;
    }
    .checkout-logo {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .checkout-logo span { color: var(--accent); }
    .checkout-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 32px;
    }
    .checkout-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .checkout-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .checkout-sub {
      color: var(--muted);
      font-size: 13px;
    }
    .checkout-error { display: none; margin-top: 16px; }
    .checkout-error a { color: var(--accent); }
  </style>
</head>
<body>
<div class="checkout-page">
  <div class="checkout-container">
    <div class="checkout-logo">&#129302; Deep Feed<span>AI</span></div>
    <div class="checkout-card">
      <div class="checkout-spinner" id="spinner"></div>
      <div class="checkout-title" id="title">Completing your setup...</div>
      <div class="checkout-sub" id="subtitle">Confirming your payment with Stripe</div>
      <div class="checkout-error" id="errorBox">
        <p>Something went wrong. <a href="/signup.html">Return to signup</a></p>
      </div>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script>
onReady(async () => {
  const params = new URLSearchParams(window.location.search);
  const tenantId = parseInt(params.get('tenant_id'));

  if (!tenantId) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('title').textContent = 'Missing tenant information';
    document.getElementById('errorBox').style.display = 'block';
    return;
  }

  // Try user token from sessionStorage first (saved before Stripe redirect),
  // fall back to tenant-admin token (checkout-status accepts either via requireAnyAuth)
  const token = sessionStorage.getItem('deepfeedai_user_token') || getToken?.() || '';
  let attempts = 0;
  const maxAttempts = 30; // 60 seconds max

  const poll = setInterval(async () => {
    attempts++;
    try {
      const res = await fetch(`/api/tenants/checkout-status?tenantId=${tenantId}`, {
        headers: { Authorization: 'Bearer ' + token },
      });
      if (!res.ok) throw new Error('Failed to check status');
      const data = await res.json();

      if (data.status === 'active') {
        clearInterval(poll);
        document.getElementById('title').textContent = 'Payment confirmed!';
        document.getElementById('subtitle').textContent = 'Redirecting to your dashboard...';
        setTimeout(() => window.location.replace('/wizard.html'), 1000);
      }
    } catch {
      // Keep polling
    }

    if (attempts >= maxAttempts) {
      clearInterval(poll);
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Taking longer than expected';
      document.getElementById('subtitle').textContent = 'Your payment may still be processing. Try refreshing in a moment.';
      document.getElementById('errorBox').style.display = 'block';
    }
  }, 2000);
});
</script>
</body>
</html>

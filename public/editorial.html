<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Editorial Review</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    .review-grid { display:grid; gap:16px; }
    .review-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:18px; }
    .review-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
    .review-title { font-size:16px; font-weight:700; line-height:1.3; flex:1; }
    .review-score { font-size:14px; font-weight:700; padding:4px 10px; border-radius:8px; white-space:nowrap; }
    .review-score-high { background:rgba(34,197,94,0.15); color:#22c55e; }
    .review-score-mid { background:rgba(251,191,36,0.15); color:#fbbf24; }
    .review-score-low { background:rgba(239,68,68,0.15); color:#ef4444; }
    .review-meta { font-size:12px; color:var(--muted); margin-bottom:10px; display:flex; gap:16px; flex-wrap:wrap; }
    .review-issues { margin-bottom:12px; }
    .review-issue { font-size:13px; color:var(--muted); padding:4px 0; padding-left:16px; position:relative; }
    .review-issue::before { content:'\2022'; position:absolute; left:4px; color:var(--accent); }
    .review-suggestion { font-size:13px; color:var(--primary); font-style:italic; margin-bottom:12px; }
    .review-actions { display:flex; gap:8px; }
    .vera-section { margin:10px 0; border:1px dashed var(--border); border-radius:8px; padding:8px 12px; background:rgba(99,102,241,0.04); }
    .vera-body { margin-top:8px; display:flex; flex-direction:column; gap:5px; }
    .vera-row { font-size:12px; color:var(--text); line-height:1.5; }
    .vera-label { font-weight:600; color:var(--muted); }
    .vera-corrections { display:flex; flex-direction:column; gap:4px; margin-top:4px; }
    .vera-correction { font-size:12px; padding:4px 8px; background:var(--surface2); border-radius:6px; line-height:1.5; }
    .vera-original { color:var(--danger,#ef4444); text-decoration:line-through; }
    .vera-suggested { color:#22c55e; font-weight:600; }
    .vera-reason { color:var(--muted); font-style:italic; }
    .vera-style-notes { margin-top:4px; }
    .review-preview { margin:12px 0; padding:12px; background:var(--surface2); border-radius:8px; font-size:13px; color:var(--muted); max-height:200px; overflow-y:auto; line-height:1.6; }
    .review-empty { text-align:center; padding:60px 20px; color:var(--muted); }
    .review-stats { display:flex; gap:20px; margin-bottom:20px; }
    .review-stat { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:14px 20px; flex:1; text-align:center; }
    .review-stat-num { font-size:24px; font-weight:700; }
    .review-stat-label { font-size:12px; color:var(--muted); margin-top:4px; }
  </style>
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <div class="topbar">
      <button class="hamburger" id="hamburger">&#9776;</button>
      <div class="topbar-title">Editorial Review</div>
    </div>
    <div class="page-content" style="max-width:900px;">
      <div class="review-stats" id="reviewStats"></div>
      <div class="review-grid" id="reviewGrid">
        <div class="review-empty">Loading...</div>
      </div>
    </div>
  </div>
</div>
<script src="/admin.js"></script>
<script src="/admin-mobile-nav.js"></script>
<script src="/notifications-bell.js"></script>
<script src="/editorial-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Editorial Review</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    .review-grid { display:grid; gap:16px; }
    .review-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:18px; }
    .review-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
    .review-title { font-size:16px; font-weight:700; line-height:1.3; flex:1; }
    .review-score { font-size:14px; font-weight:700; padding:4px 10px; border-radius:8px; white-space:nowrap; }
    .review-score-high { background:rgba(34,197,94,0.15); color:#22c55e; }
    .review-score-mid { background:rgba(251,191,36,0.15); color:#fbbf24; }
    .review-score-low { background:rgba(239,68,68,0.15); color:#ef4444; }
    .review-meta { font-size:12px; color:var(--muted); margin-bottom:10px; display:flex; gap:16px; flex-wrap:wrap; }
    .review-issues { margin-bottom:12px; }
    .review-issue { font-size:13px; color:var(--muted); padding:4px 0; padding-left:16px; position:relative; }
    .review-issue::before { content:'\2022'; position:absolute; left:4px; color:var(--accent); }
    .review-suggestion { font-size:13px; color:var(--primary); font-style:italic; margin-bottom:12px; }
    .review-actions { display:flex; gap:8px; }
    .review-preview { margin:12px 0; padding:12px; background:var(--surface2); border-radius:8px; font-size:13px; color:var(--muted); max-height:200px; overflow-y:auto; line-height:1.6; }
    .review-empty { text-align:center; padding:60px 20px; color:var(--muted); }
    .review-stats { display:flex; gap:20px; margin-bottom:20px; }
    .review-stat { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:14px 20px; flex:1; text-align:center; }
    .review-stat-num { font-size:24px; font-weight:700; }
    .review-stat-label { font-size:12px; color:var(--muted); margin-top:4px; }
  </style>
</head>
<body>
<div class="admin-layout">
  <div class="main-content">
    <div class="topbar">
      <button class="hamburger" id="hamburger">&#9776;</button>
      <div class="topbar-title">Editorial Review</div>
    </div>
    <div class="page-content" style="max-width:900px;">
      <div class="tabs" style="display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);">
        <button class="tab-btn active" data-tab="articles" style="padding:10px 16px;background:none;border:none;border-bottom:2px solid var(--primary);color:var(--text);cursor:pointer;font-weight:600;">Articles <span id="articlesTabCount" class="badge" style="margin-left:6px;"></span></button>
        <button class="tab-btn" data-tab="pitches" style="padding:10px 16px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-weight:600;">Pitches <span id="pitchesTabCount" class="badge" style="margin-left:6px;"></span></button>
      </div>

      <div id="articlesPanel">
        <div class="review-stats" id="reviewStats"></div>
        <div class="review-grid" id="reviewGrid">
          <div class="review-empty">Loading...</div>
        </div>
      </div>

      <div id="pitchesPanel" style="display:none;">
        <div class="review-grid" id="pitchesGrid">
          <div class="review-empty">Loading pitches...</div>
        </div>
      </div>
    </div>

    <!-- Enrich-sources modal -->
    <div class="modal-overlay" id="enrichModal">
      <div class="modal" style="max-width:720px;">
        <div class="modal-header">
          <div class="modal-title">Enrich sources</div>
          <button class="modal-close" data-close-modal>✕</button>
        </div>
        <div class="modal-body">
          <div style="display:flex;gap:8px;margin-bottom:12px;">
            <input id="enrichQuery" type="text" placeholder="Search topic…" style="flex:1;padding:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);border-radius:6px;" />
            <button class="btn btn-primary btn-sm" id="enrichSearchBtn">Search</button>
          </div>
          <div id="enrichResults" style="max-height:50vh;overflow-y:auto;font-size:13px;">
            <div class="text-muted" style="padding:24px 8px;text-align:center;">Enter a topic and press Search.</div>
          </div>
        </div>
        <div class="modal-footer">
          <span id="enrichQuotaInfo" class="text-muted" style="font-size:12px;flex:1;"></span>
          <button class="btn btn-outline" data-close-modal>Cancel</button>
          <button class="btn btn-primary" id="enrichIngestBtn" disabled>Ingest selected</button>
        </div>
      </div>
    </div>

    <!-- Override-cap modal -->
    <div class="modal-overlay" id="overrideModal">
      <div class="modal modal-sm">
        <div class="modal-header">
          <div class="modal-title">Approve over the cap?</div>
          <button class="modal-close" data-close-modal>✕</button>
        </div>
        <div class="modal-body">
          <p id="overrideMessage" class="text-muted"></p>
          <label style="display:block;margin-top:12px;font-size:13px;">Editor justification (logged):
            <textarea id="overrideNote" rows="3" style="width:100%;margin-top:6px;padding:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);border-radius:6px;"></textarea>
          </label>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-close-modal>Cancel</button>
          <button class="btn btn-primary" id="confirmOverrideBtn">Approve with override</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/admin.js"></script>
<script src="/editorial-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Writers</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
<div class="admin-layout">
  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">&#9776;</button>
      <div class="topbar-title">Writers</div>
    </header>

    <div class="page-body">
      <div class="section-header">
        <div class="section-title">Writer Personas</div>
        <button class="btn btn-primary" id="addWriterBtn">+ Add Writer</button>
      </div>

      <div class="table-wrap"><div class="table-scroll">
        <table id="writersTable">
          <thead>
            <tr>
              <th class="th-avatar">Avatar</th>
              <th>Name</th>
              <th>Beat</th>
              <th class="th-center-sm">Auto</th>
              <th>Voice</th>
              <th class="th-center-sm">Articles</th>
              <th class="th-actions">Actions</th>
            </tr>
          </thead>
          <tbody id="writersBody">
            <tr><td colspan="7" class="td-loading"><span class="spinner"></span></td></tr>
          </tbody>
        </table>
      </div></div>
    </div><!-- /page-body -->
  </div><!-- /main-content -->
</div><!-- /admin-layout -->

<!-- Add / Edit Writer Modal -->
<div class="modal-overlay" id="writerModal">
  <div class="modal modal-md">
    <div class="modal-header">
      <div class="modal-title" id="writerModalTitle">Add Writer</div>
      <button class="modal-close" data-close-modal>&#10005;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editWriterId" />

      <div class="form-group">
        <label class="form-label">Name <span class="required">*</span></label>
        <input type="text" class="form-control" id="fWriterName" placeholder="e.g. Ghost" required />
      </div>

      <div class="form-group">
        <label class="form-label">Slug</label>
        <input type="text" class="form-control" id="fWriterSlug" placeholder="Auto-generated from name" />
      </div>

      <div class="form-group">
        <label class="form-label">Avatar Image</label>
        <input type="file" class="form-control" id="fWriterAvatar" accept="image/*" />
        <div id="writerAvatarPreviewWrap" class="mt-2" style="display:none;">
          <img id="writerAvatarPreview" src="" alt="Avatar preview" class="avatar-preview-img" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Bio</label>
        <textarea class="form-control" id="fWriterBio" rows="2" placeholder="Short bio for this writer"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Beat</label>
        <select class="form-control" id="fWriterBeat">
          <option value="">None</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Keywords</label>
        <input type="text" class="form-control" id="fWriterKeywords" placeholder="Comma-separated, e.g. security, hacking, privacy" />
      </div>

      <div class="form-group">
        <label class="form-label">System Prompt</label>
        <textarea class="form-control" id="fWriterSystemPrompt" rows="4" placeholder="You are Ghost, a no-nonsense cybersecurity analyst..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">TTS Voice</label>
        <select class="form-control" id="fWriterVoice">
          <option value="">None (no audio)</option>
        </select>
        <p class="form-help">Optional: link a TTS voice for audio generation.</p>
      </div>

      <div class="form-check" style="margin-bottom:12px;">
        <input type="checkbox" id="fWriterIsAuto" style="width:16px;height:16px;" />
        <label for="fWriterIsAuto" class="form-check-label">Auto mode (auto-claim articles and run synthesis)</label>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Synthesis Schedule</label>
          <select class="form-control" id="fWriterSchedule">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="manual">Manual</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Lookback Hours</label>
          <input type="number" class="form-control" id="fWriterLookback" value="168" min="1" max="8760" />
        </div>
        <div class="form-group">
          <label class="form-label">Min Cluster Size</label>
          <input type="number" class="form-control" id="fWriterMinCluster" value="3" min="1" max="100" />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close-modal>Cancel</button>
      <button class="btn btn-primary" id="saveWriterBtn">Save Writer</button>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="deleteWriterModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <div class="modal-title">Delete Writer</div>
      <button class="modal-close" data-close-modal>&#10005;</button>
    </div>
    <div class="modal-body">
      <p class="text-muted">Are you sure you want to delete <strong id="deleteWriterName"></strong>? Articles assigned to this writer will become unassigned.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close-modal>Cancel</button>
      <button class="btn btn-danger" id="confirmDeleteWriterBtn">Delete</button>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script src="/writers-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Analytics</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    /* ── Range tabs ── */
    .range-tabs {
      display: flex;
      gap: 4px;
    }
    .range-tab {
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
    }
    .range-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* ── Stat delta trends ── */
    .stat-delta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .stat-delta.up   { color: var(--success, #4ade80); }
    .stat-delta.down { color: var(--danger, #f87171); }

    /* ── Chart containers ── */
    .chart-container {
      position: relative;
      height: 220px;
      padding: 16px 20px 12px;
    }

    /* ── Top articles table tweaks ── */
    .analytics-table th { white-space: nowrap; }
    .analytics-table td.title-cell {
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div class="admin-layout">
  <!-- Main -->
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Analytics</h1>
        <p class="page-subtitle">Page views, audio plays, and top content — last updated <span id="lastUpdated">—</span></p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="range-tabs" id="rangeTabs"></div>
        <button class="btn btn-primary" id="refreshBtn">↻ Refresh</button>
      </div>
    </div>

    <!-- Stat cards -->
    <div class="stats-grid" id="statCards">
      <div class="stat-card">
        <div class="stat-label">Views</div>
        <div class="stat-value" id="statViews">—</div>
        <div class="stat-delta" id="statViewsDelta"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Audio Plays</div>
        <div class="stat-value" id="statAudioPlays">—</div>
        <div class="stat-delta" id="statAudioDelta"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Shares</div>
        <div class="stat-value" id="statShares">—</div>
        <div class="stat-delta" id="statSharesDelta"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">All-Time Views</div>
        <div class="stat-value" id="statTotalViews">—</div>
        <div class="stat-delta">total</div>
      </div>
    </div>

    <!-- Views over time -->
    <div class="card-section" style="margin-top:24px;">
      <div class="section-header">
        <h2 class="section-title" id="chartTitle">Daily Views</h2>
      </div>
      <div class="chart-container">
        <canvas id="viewsChart"></canvas>
      </div>
    </div>

    <!-- Two-column: top articles + category breakdown -->
    <div style="display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:20px;">

      <!-- Top articles -->
      <div class="card-section">
        <div class="section-header">
          <h2 class="section-title">Top Articles</h2>
          <span class="text-muted text-sm" id="topArticlesRange">by views</span>
        </div>
        <div style="overflow-x:auto;">
          <table class="data-table analytics-table" id="topArticlesTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Category</th>
                <th>Views</th>
                <th>🎧</th>
                <th>↗</th>
              </tr>
            </thead>
            <tbody id="topArticlesTbody">
              <tr><td colspan="6" class="text-muted text-center" style="padding:24px;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Category breakdown -->
      <div class="card-section">
        <div class="section-header">
          <h2 class="section-title">By Category</h2>
          <span class="text-muted text-sm" id="categoryRange">views</span>
        </div>
        <div style="padding:16px;">
          <div class="chart-container" style="height:280px;padding:0;">
            <canvas id="categoryChart"></canvas>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="/admin.js"></script>
<script src="/analytics-page.js"></script>
</body>
</html>

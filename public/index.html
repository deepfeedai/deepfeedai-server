<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Dashboard</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">🤖 Deep Feed<span>AI</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Navigation</div>
      <a class="nav-link active" href="/index.html">
        <span class="icon">📊</span> Dashboard
      </a>
      <a class="nav-link" href="/articles.html">
        <span class="icon">📰</span> Articles
      </a>
      <a class="nav-link" href="/sources.html">
        <span class="icon">📡</span> Sources
      </a>
      <a class="nav-link" href="/voices.html"><span class="icon">🎙️</span> Voices</a>
      <a class="nav-link" href="/settings.html"><span class="icon">⚙️</span> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-link" data-logout>
        <span class="icon">🚪</span> Logout
      </button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <div class="topbar-title">Dashboard</div>
      <span id="topbarUser" style="color:var(--muted);font-size:13px;"></span>
    </header>

    <div class="page-body">
      <div id="alertArea"></div>

      <!-- Stat Cards -->
      <div class="stat-grid" id="statGrid">
        <div class="stat-card">
          <div class="stat-icon">📰</div>
          <div class="stat-label">Total Articles</div>
          <div class="stat-value" id="statTotal">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-label">Published</div>
          <div class="stat-value" id="statPublished">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⭐</div>
          <div class="stat-label">Featured</div>
          <div class="stat-value" id="statFeatured">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📡</div>
          <div class="stat-label">Active Sources</div>
          <div class="stat-value" id="statSources">—</div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions">
        <a href="/articles.html" class="btn btn-primary">＋ Add Article</a>
        <a href="/sources.html" class="btn btn-outline">＋ Add Source</a>
      </div>

      <!-- Recent Articles -->
      <div class="section-header">
        <div class="section-title">Recent Articles</div>
        <a href="/articles.html" class="btn btn-ghost btn-sm">View all →</a>
      </div>

      <div class="table-wrap">
        <table id="recentTable">
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Status</th>
              <th>Featured</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="recentBody">
            <tr><td colspan="5" style="text-align:center;color:var(--muted);padding:32px;">
              <span class="spinner"></span>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script src="/index-page.js"></script>
</body>
</html>

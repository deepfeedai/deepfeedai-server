<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepFeedAI Admin — Newsletter</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>
    .preview-frame-wrap {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #0d0d1a;
      position: relative;
    }
    .preview-frame-wrap iframe {
      width: 100%;
      height: 600px;
      border: none;
      display: block;
    }
    .preview-placeholder {
      height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .preview-placeholder .big-icon { font-size: 48px; }
    .send-bar {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .send-bar .form-group { flex: 1; min-width: 200px; margin-bottom: 0; }
    .history-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success, #10b981);
      margin-right: 6px;
    }
  </style>
</head>
<body>
<div class="admin-layout">
  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <div class="topbar-title">Newsletter</div>
    </header>

    <div class="page-body">

      <!-- Send controls -->
      <div class="section-header">
        <div class="section-title">Send Newsletter</div>
      </div>

      <div class="settings-card">
        <div class="settings-card-header">
          <div class="settings-card-icon">✉️</div>
          <div>
            <div class="settings-card-title">Compose &amp; Send</div>
            <div class="settings-card-subtitle">Builds an email from the latest 8 published articles and sends to your Resend audience</div>
          </div>
        </div>

        <div class="send-bar" style="margin-bottom:16px;">
          <div class="form-group">
            <label class="form-label">Subject line <span class="text-muted text-sm">(optional — uses site config default if blank)</span></label>
            <input type="text" id="subjectInput" class="form-control" placeholder="🤖 Deep Feed AI — Your Weekly AI Digest" />
          </div>
          <button class="btn btn-outline" id="previewBtn">👁 Preview</button>
          <button class="btn btn-primary" id="sendBtn">🚀 Send Now</button>
        </div>

        <div id="sendStatus"></div>
      </div>

      <!-- Preview -->
      <div class="section-header" style="margin-top:24px;">
        <div class="section-title">Email Preview</div>
        <button class="btn btn-outline btn-sm" id="refreshPreviewBtn" style="display:none;">↻ Refresh</button>
      </div>

      <div class="preview-frame-wrap" id="previewWrap">
        <div class="preview-placeholder" id="previewPlaceholder">
          <div class="big-icon">📧</div>
          <div>Click <strong>Preview</strong> to render the email</div>
        </div>
        <iframe id="previewFrame" style="display:none;" title="Newsletter preview" sandbox="allow-same-origin"></iframe>
      </div>

      <!-- Send history -->
      <div class="section-header" style="margin-top:32px;">
        <div class="section-title">Send History</div>
      </div>

      <div class="table-wrap">
        <table class="data-table" id="historyTable">
          <thead>
            <tr>
              <th>Sent At</th>
              <th>Subject</th>
              <th>Articles</th>
              <th>Broadcast ID</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="historyTbody">
            <tr><td colspan="5" class="text-muted text-center" style="padding:24px;">Loading…</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script src="/newsletter-page.js"></script>
</body>
</html>

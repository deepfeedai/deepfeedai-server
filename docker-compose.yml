services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deepfeedai
      POSTGRES_USER: deepfeedai
      POSTGRES_PASSWORD: deepfeedai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepfeedai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deepfeed

  app:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://deepfeedai:deepfeedai@postgres:5432/deepfeedai
    volumes:
      - ./data/media:/app/public/media
    networks:
      - deepfeed

volumes:
  pgdata:

networks:
  deepfeed:
